# DLAP Da-discovery Service Configuration
# Standardized configuration for Docker and local development

spring.application.name=DADiscovery
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Server Configuration
server.port=8080
# No context-path: controllers already map their full paths (/api/v1/discovery/...,
# plus dev endpoints /api/kafka, /api/v1/logs, ...). A context-path here doubled the
# /api/v1/discovery routes (/api/v1/discovery/api/v1/discovery/...) so the UI and the
# admin->discovery Feign client 404'd. Closes Q-015.

# Database Configuration - using infrastructure PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgresql:5432/dlap_common}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:da_discovery_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:da_discovery_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:dlap_discovery}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=true

# Flyway (schema migrations) - N3/R-P0-4: replaces Liquibase. V1 is the
# consolidated Hibernate-derived baseline; baseline-on-migrate protects
# databases the Liquibase era already populated (they skip V1).
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${SPRING_JPA_PROPERTIES_HIBERNATE_DEFAULT_SCHEMA:dlap_discovery}
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
spring.kafka.consumer.group-id=${spring.application.name}

# Security Configuration
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}
# Q-014: signature-only (jwk-set-uri) so the UI's localhost:8180-issued token is accepted; see OPEN_QUESTIONS Q-014
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://keycloak:8080/realms/dlap}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://keycloak:8080/realms/dlap/protocol/openid-connect/certs}
spring.security.oauth2.client.provider.oidc.issuer-uri=${SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI:http://keycloak:8080/realms/dlap}
spring.security.oauth2.client.registration.oidc.client-id=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_ID:da-discovery}
spring.security.oauth2.client.registration.oidc.client-secret=${SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET:}

# Disable Spring Cloud Config Client
spring.cloud.config.enabled=false

# Management Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always

# Profile specific overrides
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# GCP Configuration
gcp.bucket.exclude.objects=aia-dev-audit-bucket
