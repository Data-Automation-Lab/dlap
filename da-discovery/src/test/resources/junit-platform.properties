# Timeouts catch a hung test, not a slow one. The first test in a JVM pays for class loading,
# Mockito's inline agent and Spring MVC start-up (WebConfigurerTest: 4 s on an idle 20-core box,
# 9 s at 2x CPU oversubscription), so a 15 s limit tripped under parallel load. 60 s keeps hang
# detection and leaves room for a loaded CI runner.
junit.jupiter.execution.timeout.default = 60 s
junit.jupiter.execution.timeout.testable.method.default = 60 s
junit.jupiter.execution.timeout.beforeall.method.default = 60 s
junit.jupiter.execution.timeout.beforeeach.method.default = 60 s
junit.jupiter.testclass.order.default=com.dlap.discovery.sd.config.SpringBootTestClassOrderer
