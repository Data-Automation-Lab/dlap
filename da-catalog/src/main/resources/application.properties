# DLAP Da-catalog Service Configuration
# Standardized configuration for Docker and local development

spring.application.name=da-catalog
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Server Configuration
server.port=8080
# No context-path: every controller already maps the full /api/v1/catalog/...
# path. A context-path here doubled every route (/api/v1/catalog/api/v1/catalog/
# ...) and 404'd all cross-service REST / Feign / UI calls.

# Database Configuration - using infrastructure PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/da_catalog
spring.datasource.username=${DB_USER:da_catalog_user}
spring.datasource.password=${DB_PASS:da_catalog_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# da-catalog spans BOTH its own dlap_catalog schema (Flyway-migrated, V1 creates
# dlap_asset_lineage) AND the shared dlap_common schema, which is bootstrapped by raw SQL
# init scripts and read by multiple services (CLAUDE.md section 6, deliberately NOT
# Hibernate-managed). The default is validate (CLAUDE.md section 6: validate in production,
# never update or create): Hibernate checks every mapped table and column at boot and
# refuses to start on drift, instead of silently altering the shared schema.
# CommonSchemaValidateTest proves validate passes against the init scripts plus Flyway
# (text[] and jsonb columns included). To adopt an existing database that was bootstrapped
# with ddl-auto=update, follow docs/guides/upgrade.md.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=dlap_catalog
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dlap_catalog
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Kafka Configuration - using infrastructure Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Discovery ingest (da-discovery → dlap.discovery.asset.discovered)
dlap.catalog.discovery-listener-enabled=${DLAP_CATALOG_DISCOVERY_LISTENER_ENABLED:true}

# Catalog event ingest (CAT-02a, ADR-0055; docs/specs/asset-descriptor.md "Catalog event ingest").
# Governed prefixes (ADR-0046 section 1): comma-separated canonical object-URI prefixes, for example
# gs://finance-bucket/pii/,s3://lake/curated/. Objects under them get their own catalog row; every
# other object event only rolls up to its container. Empty by default: no object rows.
dlap.catalog.ingest.governed-prefixes=${DLAP_CATALOG_GOVERNED_PREFIXES:}
# processed_event pruning. The retention must exceed the log store's replay window
# (dlap.logingest.retention-days, default 90), or a replay of an older event counts its read again.
dlap.catalog.ingest.processed-event.retention=${DLAP_CATALOG_PROCESSED_EVENT_RETENTION:P100D}
dlap.catalog.ingest.processed-event.prune-enabled=${DLAP_CATALOG_PROCESSED_EVENT_PRUNE_ENABLED:true}
dlap.catalog.ingest.processed-event.prune-interval=PT1H
dlap.catalog.ingest.processed-event.prune-batch-size=10000
# Matching of event targets to rows stored before canonical IDs (normalize(existing asset_uri)).
dlap.catalog.ingest.match.index-on-startup=true
dlap.catalog.ingest.match.index-batch-size=500
dlap.catalog.ingest.match.catch-up-interval=PT30S
# Deployment-wide normalization context for stored forms that need it (single-tenant, ADR-0049).
dlap.catalog.ingest.match.default-hints.account=${DLAP_CATALOG_DEFAULT_ACCOUNT:}
dlap.catalog.ingest.match.default-hints.project=${DLAP_CATALOG_DEFAULT_PROJECT:}
dlap.catalog.ingest.match.default-hints.metastore-id=${DLAP_CATALOG_DEFAULT_METASTORE_ID:}
dlap.catalog.ingest.match.default-hints.workspace-id=${DLAP_CATALOG_DEFAULT_WORKSPACE_ID:}
# Retention (CAT-03, ADR-0046; docs/specs/asset-descriptor.md "Retention"). A cluster-wide sweep
# (ShedLock JDBC, plan rule R7) evaluates every asset that is not DELETED against its rules and
# writes dlap_assets.retention_*; a change of retention_status queues a dlap.catalog.asset.retention-due
# event (transactional outbox) that a second singleton job publishes.
dlap.catalog.retention.enabled=${DLAP_CATALOG_RETENTION_ENABLED:true}
# Spring cron with a seconds field: minute 15 of every hour.
dlap.catalog.retention.cron=${DLAP_CATALOG_RETENTION_CRON:0 15 * * * *}
# Longest the sweep lock is held: at least twice the expected run.
dlap.catalog.retention.lock-at-most-for=PT2H
dlap.catalog.retention.page-size=200
# An unchanged result is rewritten (retention_evaluated_at refreshed) when it is older than this.
dlap.catalog.retention.evaluated-at-refresh=P1D
# Label defaults (rule source LABEL_DEFAULT): a period in days from a basis for every asset that
# carries the label. Empty by default. Example:
#   dlap.catalog.retention.label-defaults[0].label=PII
#   dlap.catalog.retention.label-defaults[0].days=365
#   dlap.catalog.retention.label-defaults[0].basis=LAST_ACCESSED
# A label that counts as a legal hold (status ON_HOLD while it is assigned; the legalHold flag itself
# changes only through the API). Blank by default: a LEGAL_HOLD label is advisory.
dlap.catalog.retention.legal-hold-label=${DLAP_CATALOG_LEGAL_HOLD_LABEL:}
# Consumers: setRetention actions of the policy engine (dlap.policies.actions) and the log bindings'
# status (dlap.logingest.binding.status, the read signal).
dlap.catalog.retention.set-retention-listener-enabled=${DLAP_CATALOG_RETENTION_ACTION_LISTENER_ENABLED:true}
dlap.catalog.retention.binding-status-listener-enabled=${DLAP_CATALOG_RETENTION_BINDING_LISTENER_ENABLED:true}
# Publisher of the retention-due outbox.
dlap.catalog.retention.publish.enabled=${DLAP_CATALOG_RETENTION_PUBLISH_ENABLED:true}
dlap.catalog.retention.publish.interval=PT15S
dlap.catalog.retention.publish.initial-delay=PT30S
dlap.catalog.retention.publish.batch-size=100
dlap.catalog.retention.publish.send-timeout=PT30S
dlap.catalog.retention.publish.lock-at-most-for=PT10M
dlap.catalog.retention.publish.outbox-retention=P7D
# SEC-03: a closed list, never a wildcard. The consumers of this service read values as Object or String and
# ignore type headers (KAFKA-01), so the list is a second lock behind the first.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dlap.common.logevent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all

# Security Configuration - using infrastructure Keycloak
# Q-014: signature-only (jwk-set-uri) so the UI's localhost:8180-issued token is accepted; see OPEN_QUESTIONS Q-014
#spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASS:}
spring.data.redis.timeout=2000ms

# Pagination hardening: cap client-supplied page size to prevent unbounded queries (DoS)
spring.data.web.pageable.max-page-size=200

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.endpoint.health.probes.enabled=true

# Logging Configuration
logging.level.com.dlap=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n

# DLAP Specific Configuration
dlap.service.name=Da-catalog Service
dlap.service.version=1.0.0
dlap.service.description=Da-catalog microservice for DLAP platform

# Common entities database connection (for da-protos entities)
dlap.common-db.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/dlap_common
dlap.common-db.username=${DB_USER:dlap}
dlap.common-db.password=${DB_PASS}

# Kafka topics
dlap.kafka.topics.asset-discovered=dlap.assets.discovered
dlap.kafka.topics.asset-labeled=dlap.assets.labeled
dlap.kafka.topics.label-assignment-changed=dlap.asset.label.assignment.changed
dlap.kafka.topics.policy-evaluations=dlap.policies.evaluations

# CORS Configuration
dlap.security.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:4200}

# JWT Claims Configuration
dlap.security.jwt.claims.user-id=sub
dlap.security.jwt.claims.username=preferred_username
dlap.security.jwt.claims.roles=realm_access.roles

# Profile specific overrides
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Unity Catalog integration (ADR-0029) - optional external-metastore sink.
# Off by default. When enabled, da-catalog mirrors tabular assets into a
# Unity Catalog server as catalog.schema.table with DLAP labels as properties.
dlap.catalog.unity.enabled=${DLAP_UNITY_ENABLED:false}
dlap.catalog.unity.uri=${DLAP_UNITY_URI:http://localhost:8081/api/2.1/unity-catalog}
dlap.catalog.unity.token=${DLAP_UNITY_TOKEN:}
dlap.catalog.unity.catalog=${DLAP_UNITY_CATALOG:dlap}
dlap.catalog.unity.schema=${DLAP_UNITY_SCHEMA:default}
