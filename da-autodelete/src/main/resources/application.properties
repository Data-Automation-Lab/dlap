# DLAP AutoDelete Service Configuration
spring.application.name=da-autodelete
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
server.port=8087

# Database Configuration - da_autodelete database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/da_autodelete
spring.datasource.username=${DB_USER:da_autodelete_user}
spring.datasource.password=${DB_PASS:da_autodelete_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
# validate is the default (CLAUDE.md section 6: validate in production, never update or
# create). Every table is Flyway-owned: V2 audit, V3 soft-delete records, V4 deletion config
# and tasks. AutodeleteFlywayValidateTest proves a clean apply satisfies validate.
# To adopt a database that was bootstrapped with ddl-auto=update, follow docs/guides/upgrade.md.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=dlap_autodelete
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dlap_autodelete
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Common entities database configuration (for da-protos entities)
dlap.common.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/dlap_common
dlap.common.datasource.username=${DB_USER:da_autodelete_user}
dlap.common.datasource.password=${DB_PASS:da_autodelete_pass}
dlap.common.datasource.driver-class-name=org.postgresql.Driver

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# SEC-03: a closed list, never a wildcard. The consumers of this service read values as Object or String and
# ignore type headers (KAFKA-01), so the list is a second lock behind the first.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dlap.common.logevent
# Q-029: cap a client-supplied page size (Spring Data allows 2000 by default).
spring.data.web.pageable.max-page-size=200
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Kafka Topics
dlap.kafka.topics.policy-actions=dlap.policies.actions
dlap.kafka.topics.deletion-events=dlap.deletion.events

# Security Configuration (Keycloak JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Cloud Storage Configuration
# AWS S3 Configuration
aws.s3.region=us-east-1
aws.s3.bucket.primary=dlap-primary-bucket

# Azure Blob Storage Configuration
azure.storage.account.name=dlapprimary
azure.storage.container.primary=primary-container

# Google Cloud Storage Configuration
gcp.storage.project.id=dlap-project
gcp.storage.bucket.primary=dlap-gcp-primary

# Deletion Configuration
deletion.safety.confirmation.required=true
deletion.backup.enabled=true
deletion.backup.retention.days=30
deletion.secure.overwrite.enabled=false
deletion.batch.size=50

# Delete executor (RET-02, docs/specs/approvals.md section 9, decision D20). Safe by default
# (decision D23): with dry-run-cloud-delete=true every rule is checked (approval re-read from the
# policy engine, 2 distinct approvers for the hard delete, nobody approves their own request, the
# window floor, legal hold, FULL read coverage) and the native lifecycle rule or engine delete is
# planned, recorded and audited, but nothing is applied in the cloud. Dry-run rows end
# DRY_RUN_COMPLETE, stamped "DRY-RUN: no cloud call". Set DLAP_AUTODELETE_DRY_RUN_CLOUD_DELETE=false
# only in a pilot that deletes, after reading da-autodelete/README.md.
dlap.autodelete.dry-run-cloud-delete=${DLAP_AUTODELETE_DRY_RUN_CLOUD_DELETE:true}
dlap.autodelete.soft-delete-window-days=${DLAP_AUTODELETE_SOFT_DELETE_WINDOW_DAYS:30}
dlap.autodelete.window-floor-days=${DLAP_AUTODELETE_WINDOW_FLOOR_DAYS:7}
dlap.autodelete.hard-delete-required-approvals=${DLAP_AUTODELETE_HARD_DELETE_REQUIRED_APPROVALS:2}
# Retire sweeper: ShedLock "autodelete-retire-sweep" (database time) plus FOR UPDATE SKIP LOCKED per row.
dlap.autodelete.sweep.interval=${DLAP_AUTODELETE_SWEEP_INTERVAL:PT1M}
dlap.autodelete.sweep.initial-delay=${DLAP_AUTODELETE_SWEEP_INITIAL_DELAY:PT1M}
dlap.autodelete.sweep.lock-at-most-for=PT10M
# How long after a rule takes effect the provider's own delete event is expected.
dlap.autodelete.proof.overdue-after=${DLAP_AUTODELETE_PROOF_OVERDUE_AFTER:P3D}
# ARM ids of the storage accounts whose lifecycle management policy DLAP may change (comma separated).
dlap.autodelete.native-rule.azure-storage-account-ids=${DLAP_AUTODELETE_AZURE_STORAGE_ACCOUNT_IDS:}
# RET-06 (Q-677): a bucket, prefix or container rule is age-based; it deletes an object this many days after it
# was written (at least 1). The executor removes its own rule this long after applying it (record RULE_ENDED);
# job "autodelete-rule-in-force-end" under ShedLock, database time. RET-08 (Q-695): the same maximum age ends an
# applied rule that no provider event ever proved (record RULE_ENDED_UNPROVEN, a WARN, metric
# dlap.autodelete.rules.ended_unproven).
dlap.autodelete.native-rule.container-expiration-days=${DLAP_AUTODELETE_CONTAINER_EXPIRATION_DAYS:1}
dlap.autodelete.rule-in-force.max-age=${DLAP_AUTODELETE_RULE_IN_FORCE_MAX_AGE:P30D}
dlap.autodelete.rule-in-force.interval=${DLAP_AUTODELETE_RULE_IN_FORCE_INTERVAL:PT1H}
dlap.autodelete.rule-in-force.initial-delay=${DLAP_AUTODELETE_RULE_IN_FORCE_INITIAL_DELAY:PT5M}
dlap.autodelete.rule-in-force.lock-at-most-for=PT10M
# RET-08 (Q-713): TEST-ONLY endpoints of the S3, GCS and Azure appliers, for an emulator in a harness (LocalStack
# or moto, fake-gcs-server, an Azure Resource Manager stub over https). Empty in production; each applier logs a
# WARN at start-up while its endpoint is set. S3 sends path-style requests by default. EXEC-01 (Q-745): the prod
# profile refuses to start with any of them set (TestEndpointGuard). da-autoarchival uses the same scheme,
# dlap.autoarchival.test-endpoint.*.
dlap.autodelete.test-endpoint.s3=${DLAP_AUTODELETE_TEST_ENDPOINT_S3:}
dlap.autodelete.test-endpoint.s3-path-style=${DLAP_AUTODELETE_TEST_ENDPOINT_S3_PATH_STYLE:true}
dlap.autodelete.test-endpoint.gcs=${DLAP_AUTODELETE_TEST_ENDPOINT_GCS:}
dlap.autodelete.test-endpoint.azure=${DLAP_AUTODELETE_TEST_ENDPOINT_AZURE:}

# AWS Actor role (EXEC-01, Q-722, ADR-0110). Empty: the SDK default chain (instance profile, environment keys,
# shared profile, or an EKS web identity token through IRSA) is the Actor. A role ARN, or the name of an
# environment variable that holds one (optionally env:NAME), makes the service assume that role with STS, session
# name dlap-autodelete; external-id is the sts:ExternalId of the role's trust policy; sts-endpoint and sts-region
# are optional. Configuration only: nothing is called until a request is signed.
dlap.autodelete.aws.credentials-ref=${DLAP_AUTODELETE_AWS_CREDENTIALS_REF:}
dlap.autodelete.aws.external-id=${DLAP_AUTODELETE_AWS_EXTERNAL_ID:}
dlap.autodelete.aws.sts-endpoint=${DLAP_AUTODELETE_AWS_STS_ENDPOINT:}
dlap.autodelete.aws.sts-region=${DLAP_AUTODELETE_AWS_STS_REGION:}

# The policy engine approval API (read and request approvals as the service account).
dlap.policyengine-service.url=${POLICYENGINE_SERVICE_URL:http://da-policyengine:8080}

# da-catalog Feign client (for asset-locator resolution)
dlap.catalog-service.url=${CATALOG_SERVICE_URL:http://da-catalog:8082}
# Default provider hint used only as diagnostic reference by AssetLocatorResolver;
# callers whose id cannot be resolved are failed, not silently routed.
dlap.autodelete.default-provider=${AUTODELETE_DEFAULT_PROVIDER:GCP}

# Resilience4j circuit breaker for da-catalog Feign calls
resilience4j.circuitbreaker.instances.da-catalog.sliding-window-size=20
resilience4j.circuitbreaker.instances.da-catalog.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.da-catalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.da-catalog.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.da-catalog.permitted-number-of-calls-in-half-open-state=3

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true

# OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Logging Configuration
logging.level.com.dlap.autodelete=INFO
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=WARN 