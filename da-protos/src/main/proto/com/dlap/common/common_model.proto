syntax = "proto3";

package com.dlap.common;

option java_package = "com.dlap.common.protos";
option java_outer_classname = "CommonModelProtos";
option java_multiple_files = true;

// A simple wrapper for UUID string values.
message UUIDValue {
    string value = 1;
}

