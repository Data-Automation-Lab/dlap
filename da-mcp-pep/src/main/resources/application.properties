# DLAP da-mcp-pep - reference MCP Policy Enforcement Point (ADR-0040, V4-C6).
# A thin client that fronts an MCP server and enforces AuthZEN verdicts from
# the DLAP PDP (da-policyengine). Stateless: no datasource, no Kafka, no Flyway.

spring.application.name=da-mcp-pep
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
server.port=8091

# Caller authentication (SEC-07). The PEP is a JWT resource server: every request except the health
# probes needs a Keycloak bearer token whose signature, validity period, issuer and audience check out,
# and POST /mcp/v1/authorize needs ROLE_SERVICE_ACCOUNT or ROLE_ADMIN. Unlike the other services there
# is no off switch and no development default for the issuer and the audience: the PEP refuses to start
# until both are set.
#   KEYCLOAK_AUTH_SERVER_URL                 base URL of Keycloak (the realm key set is read from it).
#   DLAP_SECURITY_JWT_EXPECTED_ISSUER        one issuer, or several separated by commas, exactly as the
#                                            tokens carry them in iss (for example https://auth.example.com/realms/dlap).
#   DLAP_SECURITY_JWT_EXPECTED_AUDIENCE      the audience (aud) the tokens of PEP callers carry.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs
dlap.security.jwt.expected-issuer=${DLAP_SECURITY_JWT_EXPECTED_ISSUER:}
dlap.security.jwt.expected-audience=${DLAP_SECURITY_JWT_EXPECTED_AUDIENCE:}

# DLAP PDP (da-policyengine) - the AuthZEN Policy Decision Point. The PEP
# POSTs mapped evaluation requests to ${dlap.pdp.base-url}/access/v1/evaluation
# (docs/specs/enforcement-contract.md §1/§2/§3).
dlap.pdp.base-url=${DLAP_PDP_BASE_URL:http://localhost:8083}

# Bearer token the PEP presents to the PDP. In production the PEP obtains a
# ROLE_SERVICE_ACCOUNT token via client-credentials (ADR-0034); the default
# StaticPdpTokenProvider reads this static value (empty = no Authorization
# header, for local/dev against a permissive PDP).
dlap.pdp.token=${DLAP_PDP_TOKEN:}

# Local decision cache. TTL in seconds for cached verdicts keyed on
# (principalId | action | resourceUri-or-assetId).
dlap.mcppep.cache.ttl-seconds=${DLAP_MCPPEP_CACHE_TTL:30}

# Enforcement mode: enforce | observe.
#   enforce - PDP unavailable fails CLOSED (deny).
#   observe - PDP unavailable fails OPEN (allow, flagged failClosed for audit).
dlap.mcppep.mode=${DLAP_MCPPEP_MODE:enforce}

# Actuator - /actuator/health returns 200 when the PEP is up (actuator is
# inherited from the root build; health is public, see SecurityConfiguration).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true

# Logging.
logging.level.com.dlap=${LOG_LEVEL:INFO}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n
