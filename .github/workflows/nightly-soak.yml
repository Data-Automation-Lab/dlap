# Scale and soak run (work package E2E-02, decision D39; sized for a hosted runner by CI-03, D41, Q-780).
#
# The scheduled run and the default of a manual run is mode "hosted": e2e-tests/perf/run.sh hosted drives
# 1,000,000 CloudTrail, 250,000 GCP and 250,000 Azure synthetic records through the log layer, a backfill that
# is killed and resumed, and the flaws.cloud check. It is sized for ubuntu-latest (2 vCPU, 7.9 GB of memory,
# about 14 GB of disk) from the measured lite run of 2026-11-02 (e2e-tests/perf/results/lite-2026-11-02.md):
#   rate      300,000 events in 617 s = 486.2 events/s end to end, on a 20 CPU machine
#   time      1,500,000 / 486.2 = 3,085 s = 51 min of load at that rate; the load budget is 180 min
#             (PERF_TIMEOUT_MIN), which still holds at 139 events/s, 29 percent of the measured rate. Add 20 min
#             of build and start, 5 to 10 min of backfill resume and up to 10 min of flaws.cloud: the job limit
#             is 240 min (4 h)
#   size      1,482 bytes per event (423.9 MiB for 300,000) x 1,500,000 = 2.22 GB of Postgres; with the Kafka
#             log and the generated data, each bounded by the same figure, and 6.4 GB of images, at most 13.1 GB
#             of the 14 GB
# The rate was measured on 20 CPUs and has not been measured on a hosted runner; the first dispatch measures it
# (a load that does not finish in its budget fails load_all_events_stored and the results file says how far it
# got). Mode "full" is the plan's 10M + 2M + 2M = 14,000,000 events: 14,000,000 / 486.2 = 28,794 s = 8.0 h and
# 20.7 GB of Postgres, so it does not fit a hosted job (6 h at most) at the measured rate. It needs a larger
# runner (about 1.8 times the measured rate, 864 events/s, to load in its 270 minute budget) or a self-hosted
# one, and it is a manual dispatch only: set the "runner" input to that runner's label. Mode "lite" is
# 200k + 50k + 50k.
#
# The flaws.cloud archive is downloaded here, at run time, from its public URL and checked against the size and
# checksum pinned in e2e-tests/perf/flaws-cloud.pin; it is never stored in the repository. The run records
# throughput, consumer lag, Postgres growth and Kafka partition skew into a results file, which is uploaded as
# an artifact (the committed results under e2e-tests/perf/results/ come from the lite mode on a developer
# machine).
#
# Cost (decision D15, private repo on the GitHub Free plan: a fixed monthly pool of Actions minutes). A hosted
# run is expected to take about 1.5 to 4 hours, so the schedule is weekly, not nightly; change the cron line
# once a first dispatch has shown the real duration. The schedule fires only from the default branch (main).
# Run it by hand with "Run workflow" (mode hosted, lite or full).
#
# Every action is pinned to a full commit SHA with its release as a comment
# (scripts/ci-guards/pre/actions-pinned.sh enforces it).
name: DLAP Nightly Soak

on:
  schedule:
    - cron: '43 1 * * 0'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run size: hosted (1M + 250k + 250k, fits ubuntu-latest), lite (200k + 50k + 50k) or full (10M + 2M + 2M, needs a larger runner)'
        required: false
        default: 'hosted'
        type: choice
        options:
          - hosted
          - lite
          - full
      runner:
        description: 'Runner label (full mode needs a larger runner than ubuntu-latest: about 8 h and 21 GB of Postgres)'
        required: false
        default: 'ubuntu-latest'
        type: string
      flaws:
        description: 'Also run the flaws.cloud check (downloads the public archive at run time)'
        required: false
        default: true
        type: boolean
      ct_count:
        description: 'CloudTrail records (empty: the mode default; must divide evenly by 8 in full mode, by 4 in hosted and lite)'
        required: false
        default: ''
        type: string
      gcp_count:
        description: 'GCP records (empty: the mode default)'
        required: false
        default: ''
        type: string
      azure_count:
        description: 'Azure records (empty: the mode default)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: dlap-nightly-soak
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  soak:
    name: Soak (${{ inputs.mode || 'hosted' }})
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ inputs.mode == 'full' && 355 || 240 }}
    env:
      PERF_MODE: ${{ inputs.mode || 'hosted' }}
      PERF_FLAWS: ${{ (github.event_name == 'schedule' || inputs.flaws) && '1' || '0' }}
      DLAP_PERF_RESULTS_DIR: ${{ github.workspace }}/perf-results
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The stack, the emulator and about 14M stored events need room. The hosted image carries toolchains
      # this job never uses; removing them frees several GB.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Offline self-tests of the harness library
        run: bash e2e-tests/perf/test-perf-lib.sh

      # The flaws.cloud checksum is not pinned until a first run has computed it. While the pin says
      # UNPINNED every run proceeds with the size check only and prints the computed value to pin; a pinned value
      # is always enforced.
      - name: Decide whether an unpinned flaws.cloud checksum may be used
        run: |
          if grep -q '^sha256=UNPINNED' e2e-tests/perf/flaws-cloud.pin; then
            echo "DLAP_FLAWS_ALLOW_UNPINNED=1" >> "$GITHUB_ENV"
            echo "::warning title=flaws.cloud checksum::not pinned yet; this run prints the computed sha256 for e2e-tests/perf/flaws-cloud.pin"
          fi

      - name: Runner resources before the run
        run: |
          free -m
          nproc

      # The sizes are the mode's defaults unless a manual run sets them (an empty input leaves the default).
      # The load phase stops after PERF_TIMEOUT_MIN (180 in hosted mode, 270 in full mode) so the backfill test,
      # the flaws.cloud check and the artifact upload still fit in the job time limit (240 and 355 minutes); a
      # load that does not finish in that time fails load_all_events_stored and the results file says how far it
      # got.
      - name: Run the scale and soak harness
        env:
          DLAP_PERF_FLAWS: ${{ env.PERF_FLAWS }}
          PERF_CT_COUNT: ${{ inputs.ct_count }}
          PERF_GCP_COUNT: ${{ inputs.gcp_count }}
          PERF_AZURE_COUNT: ${{ inputs.azure_count }}
        run: bash e2e-tests/perf/run.sh "$PERF_MODE"

      - name: Publish the results to the job summary
        if: ${{ always() }}
        run: |
          if ls "$DLAP_PERF_RESULTS_DIR"/*.md >/dev/null 2>&1; then
            cat "$DLAP_PERF_RESULTS_DIR"/*.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results file was written." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload the results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak-results
          path: perf-results
          if-no-files-found: warn
          retention-days: 90

      - name: Dump container logs (on failure)
        if: ${{ failure() }}
        run: |
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          for name in $(docker ps -a --format '{{.Names}}' | grep '^dlap-' || true); do
            echo "::group::docker logs $name"
            docker logs --tail 200 "$name" 2>&1 || true
            echo "::endgroup::"
          done
