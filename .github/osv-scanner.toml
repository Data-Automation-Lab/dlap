# OSV-Scanner suppressions (work package CI-02b). Read by scripts/ci-guards/pre/osv.sh.
#
# There are none, on purpose. Add one only for an advisory that is wrong for this project, never to get
# a build through. Every entry needs a reason that says why the advisory does not apply and where that
# was checked, and an expiry date at most one year away, so the decision is made again.
# scripts/ci-guards/pre/scan-suppressions.sh fails the build on an entry without either, and on one past
# its date.
#
# Example (a comment, so it suppresses nothing):
#
# [[IgnoredVulns]]
# id = "GHSA-xxxx-xxxx-xxxx"
# ignoreUntil = 2027-06-30
# reason = "The vulnerable parser is never reached: the class is not on the runtime path (checked with the class listing of the boot jar on 2026-10-19, Q-000)."
