# Trivy suppressions (work package CI-02b). Read by scripts/ci-guards/scan/trivy.sh.
#
# Rules for every entry:
#   - a statement that says why the finding does not apply (not "false positive");
#   - an expired_at date, at most one year away, so the decision is made again;
#   - paths, so the suppression covers the files it was written for and nothing else.
# scripts/ci-guards/pre/scan-suppressions.sh fails the build on an entry without a statement or an
# expiry date, or past its expiry date.

# There are none. The three DS-0002 entries (no USER line in a Dockerfile) went with VULN-01: every
# shipped Dockerfile now states USER 65532:65532, and the unused JHipster variants (Dockerfile.native,
# .layered, .distroless, .alpine-jlink and da-discovery/.devcontainer) were deleted (Q-305).
#
# Example (a comment, so it suppresses nothing):
#
# vulnerabilities:
#   - id: CVE-2099-0001
#     statement: The vulnerable function is never called; checked by the call graph on 2026-10-20 (Q-000).
#     expired_at: 2027-04-30
#     paths:
#       - "da-example/src/main/docker/Dockerfile"
