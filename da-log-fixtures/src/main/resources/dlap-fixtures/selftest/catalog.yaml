# Tooling self-test family. It is an invented record shape, not a vendor log format, and no
# parser consumes it. It exists so that verifyFixtureProvenance and fixtureCoverage have a
# corpus to run on, and it stays in the build to prove both gates keep working.
family: selftest
description: Invented JSON record shape used to exercise the fixture tooling.
selftest: true
envelopes:
  - id: generic-json
    versions:
      # Fully covered and marked supported: the coverage gate must pass on it.
      - id: "1"
        supported: true
        operations: [demo:read, demo:write, demo:delete]
        variants: [demo-denied, demo-jsonl-input, demo-unknown-major]
      # Planned and only partly covered: shown as gaps in the report, never gated.
      - id: "2"
        supported: false
        operations: [demo:read, demo:write]
        variants: [demo-denied]
