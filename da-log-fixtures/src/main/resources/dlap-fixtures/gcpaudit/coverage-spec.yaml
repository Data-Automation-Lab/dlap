variants:
  # ---------------------------------------------------------------- envelopes
  - id: envelope.any-auditlog-unpack
    title: protoPayload Any unpacked to AuditLog with a type registry; a plain cast or an empty registry loses the entry (GCP-00)
    envelopes: [api-proto]
    doc_url: https://docs.cloud.google.com/java/docs/reference/google-cloud-logging/latest/com.google.cloud.logging.Payload.ProtoPayload
    research: GCP report section 0
  - id: envelope.servicedata-typeurl-base64
    title: Legacy serviceData kept as {typeUrl, base64} when the client hands DLAP the proto (log-event.md section 6)
    envelopes: [api-proto]
    versions: [bq-auditdata-legacy]
    doc_url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
    research: GCP report section 0; log-event.md section 6
  - id: envelope.rest-typed-expansion
    title: REST JSON with @type expanded server side, including an expanded serviceData object
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report section 0 (REST alternative)
  - id: envelope.gcs-shard-array
    title: Cloud Storage sink file holding a JSON array of LogEntry objects
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/storage
    research: GCP report section 5; the export page says "a list of LogEntry objects" and leaves array versus NDJSON open
  - id: envelope.gcs-shard-ndjson
    title: Cloud Storage sink file holding newline-delimited LogEntry objects
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/storage
    research: GCP report section 5
  - id: envelope.gcs-addendum-shard
    title: Late entries in an _An addendum shard parse like an _Sn shard and are not double counted
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/storage
    research: GCP report section 5
  - id: envelope.gcs-nested-log-id-path
    title: Shard path nests the log id cloudaudit.googleapis.com/data_access as directories under the bucket
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/storage
    research: GCP report section 5
  - id: envelope.gcs-unsorted-duplicates
    title: Entries in a shard are unsorted and overlapping sinks duplicate them; dedup on the native key
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/storage
    research: GCP report section 5
  - id: envelope.pubsub-base64-data
    title: Pub/Sub message data is a base64-encoded LogEntry JSON with a logging.googleapis.com/timestamp attribute
    envelopes: [json]
    doc_url: https://docs.cloud.google.com/logging/docs/export/pubsub
    status: deferred
    reason: ADR-0023 and plan decision D6, no Pub/Sub transport in 0.x
  - id: envelope.bq-protopayload-column
    title: protoPayload arrives as the protopayload_auditlog column with lowercased sub-field names
    envelopes: [bq-sink-row]
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    research: GCP report section 5
  - id: envelope.bq-json-string-columns
    title: metadata, request and response arrive as STRING JSON columns metadataJson, requestJson and responseJson
    envelopes: [bq-sink-row]
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    research: GCP report section 5
  - id: envelope.bq-servicedata-struct
    title: Legacy serviceData arrives as the typed servicedata_v1_bigquery struct
    envelopes: [bq-sink-row]
    versions: [bq-auditdata-legacy]
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    research: GCP report section 5
  - id: envelope.bq-sharded-and-partitioned
    title: Date-sharded (_YYYYMMDD) and partitioned sink tables, named from the log name with non-alphanumerics as underscores
    envelopes: [bq-sink-row]
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    research: GCP report section 5
  - id: envelope.bq-export-errors-row
    title: A row of export_errors[_YYYYMMDD] (logEntry, schemaErrorDetail, sink) is a format-broke signal, never an audit event
    envelopes: [bq-sink-row]
    negative: true
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    research: GCP report section 5
  - id: envelope.bq-statuscode-casing
    title: Both statuscode and protoPayload_auditlog.statuscode casings appear in the sink docs
    envelopes: [bq-sink-row]
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    status: unverified
    reason: The docs show both casings; verify against a live sink schema (LIVE-00 BigQuery sink capture)

  # ---------------------------------------------------------------- entry, time, dedup
  - id: entry.invalid-json
    title: Input that is not valid JSON is quarantined, never dropped silently
    negative: true
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: Log layer design B3
  - id: entry.missing-method-name
    title: protoPayload without methodName is quarantined as a missing required field
    negative: true
    doc_url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
    research: GCP report section 7, envelope row
  - id: entry.unknown-payload-type
    title: An unknown protoPayload @type, or an Any with an unknown type URL, is quarantined
    negative: true
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report section 7, envelope row
  - id: entry.protopayload-without-type
    title: protoPayload with no @type is still recognised from logName (the google-cloudevents sample has @type only on serviceData)
    doc_url: https://github.com/googleapis/google-cloudevents/tree/main/testdata/google/events/cloud/audit/v1
    research: GCP report sections 6 and 7
  - id: entry.unknown-fields
    title: Unknown fields at any depth are ignored and counted, never a rejection
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: Log layer design B1 and B7
  - id: entry.split
    title: An oversized entry split into parts (LogEntry.split) is reassembled or flagged, not counted twice
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report sections 1 and 7
  - id: entry.operation-first-last
    title: A long-running operation's first and last entries (LogEntry.operation) describe one operation
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report section 1
  - id: entry.num-response-items
    title: numResponseItems and resourceLocation present (optional fields kept, not required)
    doc_url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
    research: GCP report sections 1 and 7
  - id: time.receive-timestamp-fallback
    title: No timestamp, so event time falls back to receiveTimestamp with a quality flag; never Instant.now()
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report section 7, cross-cutting rules
  - id: time.no-timestamp
    title: Neither timestamp nor receiveTimestamp, so the entry is skipped and counted
    negative: true
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP-00 acceptance; GCP report section 7
  - id: dedup.same-insert-id
    title: The same logName, timestamp and insertId twice gives one event (native key logName|timestamp|insertId)
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    research: GCP report sections 1 and 7; log-event.md section 5.2

  # ---------------------------------------------------------------- log names
  - id: log.admin-activity
    title: logName suffix cloudaudit.googleapis.com%2Factivity
    doc_url: https://docs.cloud.google.com/logging/docs/audit
    research: GCP report sections 1 and 7
