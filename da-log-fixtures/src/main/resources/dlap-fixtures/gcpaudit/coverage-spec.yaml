# INDEPENDENT COVERAGE SPEC. READ-ONLY FOR PARSER PACKAGES.
#
# This file is the denominator of the gcpaudit coverage score (com.dlap.fixtures.CoverageSpec).
# It was written from vendor documentation, published protos and Apache-2.0 public samples by a
# package that does not build the parser (SPEC-01), so the parser author cannot grade their own
# coverage. Parser and fixture packages use these ids in meta.yaml (covers, variant_ids) and never
# edit this file. A change goes in its own commit, with no parser code and no fixture case in it;
# scripts/ci-guards/post-test/coverage-spec-lock.sh fails any other commit.
#
# Status: documented entries are scored. unverified entries wait for an opened page or a capture
# (LIVE-00, LIVE-01); deferred entries wait for a recorded decision. Neither is scored.

spec: dlap-coverage-spec/1
family: gcpaudit
title: GCP Cloud Audit Logs (LogEntry with an AuditLog payload), including Cloud Storage and BigQuery audit entries
source_kind: GCP_CLOUD_AUDIT
written_by: SPEC-01
written_on: "2026-10-19"
research:
  - "Hardening research, GCP log sources report (2026-10-18): sections 0 to 3, 5 and 7 (parser contract)"
  - "Hardening research, log layer design (2026-10-18): B1 envelopes and versions, B7 required coverage"
  - "googleapis bigquery_audit_metadata.proto and audit_data.proto (Apache-2.0, copyright 2025), opened 2026-10-19"
  - "GoogleCloudPlatform/professional-services audit-log-examples/cloud-storage samples (Apache-2.0), opened 2026-10-19"
  - "docs/specs/log-event.md (LOG-01 contract): operation spelling, native key, rawEvent conventions"
operation_id_rule: "<protoPayload.serviceName>:<protoPayload.methodName>, exactly as the record spells them (log-event.md section 4.1, field 7)."
version_rule: >-
  Audit entries carry no version field, so the version is structural (research section 7). bq-auditmetadata:
  protoPayload.metadata.@type is type.googleapis.com/google.cloud.audit.BigQueryAuditMetadata. bq-auditdata-legacy:
  protoPayload.serviceData.@type is type.googleapis.com/google.cloud.bigquery.logging.v1.AuditData. Otherwise
  auditlog-2025 when any authorizationInfo entry carries permissionType (added to the proto 2025-03-06), else
  auditlog-2021. The two auditlog profiles both emit source_schema_version auditlog on the canonical event.
notes: >-
  Not scored here, by design: the Log Analytics linked-dataset shape (proto_payload.audit_log, snake_case) is known
  only from a search snippet and has no opened page; DatasetService, RoutineService and RowAccessPolicyService
  methods are documented only as wildcards; reads of public objects, InsertAll streaming and Get/List calls produce
  no audit entry at all, so no fixture can show them (read-coverage limits belong to COV-01).

envelopes:
  - id: api-proto
    title: LogEntry from the Cloud Logging API client (gRPC); protoPayload is an Any holding AuditLog, printed to JSON per log-event.md section 6
    doc_url: https://docs.cloud.google.com/java/docs/reference/google-cloud-logging/latest/com.google.cloud.logging.Payload.ProtoPayload
    versions: [auditlog-2021, auditlog-2025, bq-auditmetadata, bq-auditdata-legacy]
  - id: json
    title: LogEntry JSON in REST field naming, as entries.list over HTTPS returns it and as Cloud Storage sink files hold it
    doc_url: https://docs.cloud.google.com/logging/docs/reference/v2/rest/v2/LogEntry
    versions: [auditlog-2021, auditlog-2025, bq-auditmetadata, bq-auditdata-legacy]
  - id: bq-sink-row
    title: Row of a BigQuery Log Router sink table (protopayload_auditlog, metadataJson/requestJson/responseJson, servicedata_v1_bigquery)
    doc_url: https://docs.cloud.google.com/logging/docs/export/bigquery
    versions: [auditlog-2021, auditlog-2025, bq-auditmetadata, bq-auditdata-legacy]

versions:
  - id: auditlog-2021
    title: AuditLog with no permissionType on authorizationInfo (records before the 2025-03-06 proto change, such as the 2021 public samples)
    doc_url: https://docs.cloud.google.com/logging/docs/reference/audit/auditlog/rest/Shared.Types/AuditLog
    detect: protoPayload @type AuditLog, or logName contains cloudaudit.googleapis.com (never require @type); no BigQuery metadata or serviceData type; no permissionType on any authorizationInfo entry
    required_fields: [logName, insertId, timestamp, resource.type, protoPayload.serviceName, protoPayload.methodName, protoPayload.resourceName]
    optional_fields: [receiveTimestamp, severity, operation, labels, trace, split, protoPayload.numResponseItems, protoPayload.resourceLocation, protoPayload.request, protoPayload.response]
  - id: auditlog-2025
    title: AuditLog with authorizationInfo[].permissionType (ADMIN_READ, ADMIN_WRITE, DATA_READ, DATA_WRITE), added to the proto 2025-03-06
    doc_url: https://raw.githubusercontent.com/googleapis/googleapis/master/google/cloud/audit/audit_log.proto
    detect: as auditlog-2021, and at least one authorizationInfo entry carries permissionType
    required_fields: [logName, insertId, timestamp, resource.type, protoPayload.serviceName, protoPayload.methodName, protoPayload.resourceName]
    optional_fields: [receiveTimestamp, severity, operation, labels, trace, split, protoPayload.numResponseItems, protoPayload.resourceLocation, protoPayload.request, protoPayload.response, protoPayload.policyViolationInfo]
  - id: bq-auditmetadata
    title: BigQuery v2 audit entry, BigQueryAuditMetadata in protoPayload.metadata (Google's current format, written since 2019-01-22)
    doc_url: https://docs.cloud.google.com/bigquery/docs/reference/auditlogs
    detect: protoPayload.metadata.@type is type.googleapis.com/google.cloud.audit.BigQueryAuditMetadata; methodName starts google.cloud.bigquery.v2.
    required_fields: [protoPayload.resourceName, "one event key in protoPayload.metadata", principal]
    optional_fields: [tableDataRead.reason, tableDataRead.jobName, tableDataRead.fields, tableDataRead.policyTags, jobChange.job.jobStats.queryStats.referencedTables, jobChange.job.jobConfig.queryConfig.statementType, jobChange.job.jobStats.endTime, jobChange.job.jobStats.totalBilledBytes, jobChange.job.jobStats.parentJobName, jobChange.job.jobStats.reservation]
  - id: bq-auditdata-legacy
    title: BigQuery v1 audit entry, AuditData in protoPayload.serviceData (the old format that reports API invocations)
    doc_url: https://raw.githubusercontent.com/googleapis/googleapis/master/google/cloud/bigquery/logging/v1/audit_data.proto
    detect: protoPayload.serviceData.@type is type.googleapis.com/google.cloud.bigquery.logging.v1.AuditData; resource.type bigquery_resource; lowercase methodName
    required_fields: [serviceData.jobCompletedEvent.job.jobConfiguration, serviceData.jobCompletedEvent.job.jobStatistics.referencedTables, serviceData.jobCompletedEvent.job.jobName]
    optional_fields: [serviceData.jobCompletedEvent.job.jobStatistics.totalTablesProcessed, serviceData.tableDataReadEvents, serviceData.jobCompletedEvent.eventName]

