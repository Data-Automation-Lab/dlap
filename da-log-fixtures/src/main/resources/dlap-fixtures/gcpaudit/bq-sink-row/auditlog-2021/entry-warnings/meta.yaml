notes: "Hand-written BigQuery Log Router sink rows for GCP-01: one JSON object per row, one member per column, NULL columns left out, TIMESTAMP columns as RFC 3339 text with microseconds, as BqSinkTransport delivers them. An unknown column and an unknown payload field are reported, not fatal; a row without timestamp takes receiveTimestamp; the first part of a split entry carries the event with PROVIDER_TRUNCATED; a System Event row of another service and the first and last rows of one long-running operation are classified by the verb heuristics, with the operation id as request id."
