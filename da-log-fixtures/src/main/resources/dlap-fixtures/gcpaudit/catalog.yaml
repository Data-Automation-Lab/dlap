# Cells the GCP-01 parser claims (supported: true is gated by fixtureCoverage at -Pdlap.fixtures.minScore).
# The parser reads all twelve cells; a cell is claimed only when the independent spec allows a 0.99 score.
#
# The independent coverage-spec.yaml next to this file (SPEC-01) is the denominator of every cell's score;
# the operation and variant lists below are therefore empty: the spec, not this file, says what is documented.
# Cases: json and api-proto cells are written by com.dlap.fixtures.gen.gcpaudit.GcpAuditCaseBook and
# confirmed by GcpAuditProtoRoundTripTest; invalid-JSON, unknown-payload and every bq-sink-row case are
# hand-written; the json seed cases come from FIX-02 (seeds.yaml).

family: gcpaudit
description: "GCP Cloud Audit Logs: LogEntry with an AuditLog payload, Cloud Storage and BigQuery v1 and v2 entries, in three envelopes."
envelopes:
  - id: api-proto
    versions:
      - id: "auditlog-2021"
        supported: true
        operations: []
        variants: []
      - id: "auditlog-2025"
        supported: true
        operations: []
        variants: []
      - id: "bq-auditmetadata"
        # Not claimed: the spec variants status.vpc-sc-denial and status.vpc-sc-ingress-egress cannot occur in
        # a BigQuery v2 entry (VPC SC metadata replaces BigQueryAuditMetadata, which makes the entry auditlog by
        # the spec's own version rule), so the cell scores 0.97 against 0.99. The parser reads the version, and
        # GcpAuditContractTest runs every case of these cells; flip to true once the spec narrows the two variants.
        supported: false
        operations: []
        variants: []
      - id: "bq-auditdata-legacy"
        supported: true
        operations: []
        variants: []
  - id: json
    versions:
      - id: "auditlog-2021"
        supported: true
        operations: []
        variants: []
      - id: "auditlog-2025"
        supported: true
        operations: []
        variants: []
      - id: "bq-auditmetadata"
        # Not claimed: the spec variants status.vpc-sc-denial and status.vpc-sc-ingress-egress cannot occur in
        # a BigQuery v2 entry (VPC SC metadata replaces BigQueryAuditMetadata, which makes the entry auditlog by
        # the spec's own version rule), so the cell scores 0.97 against 0.99. The parser reads the version, and
        # GcpAuditContractTest runs every case of these cells; flip to true once the spec narrows the two variants.
        supported: false
        operations: []
        variants: []
      - id: "bq-auditdata-legacy"
        supported: true
        operations: []
        variants: []
  - id: bq-sink-row
    versions:
      - id: "auditlog-2021"
        supported: true
        operations: []
        variants: []
      - id: "auditlog-2025"
        supported: true
        operations: []
        variants: []
      - id: "bq-auditmetadata"
        # Not claimed: the spec variants status.vpc-sc-denial and status.vpc-sc-ingress-egress cannot occur in
        # a BigQuery v2 entry (VPC SC metadata replaces BigQueryAuditMetadata, which makes the entry auditlog by
        # the spec's own version rule), so the cell scores 0.97 against 0.99. The parser reads the version, and
        # GcpAuditContractTest runs every case of these cells; flip to true once the spec narrows the two variants.
        supported: false
        operations: []
        variants: []
      - id: "bq-auditdata-legacy"
        supported: true
        operations: []
        variants: []
