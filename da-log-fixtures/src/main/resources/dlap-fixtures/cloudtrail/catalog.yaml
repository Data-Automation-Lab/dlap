# The lists were taken from the independent coverage spec written by SPEC-01 for this family
# (hardening plan, 2026-10-19). Where coverage-spec.yaml is present next to this file, it is the
# denominator of the score and this file only says which cells a parser claims. Nothing is
# claimed yet: every cell is supported: false until a parser package takes it over.

