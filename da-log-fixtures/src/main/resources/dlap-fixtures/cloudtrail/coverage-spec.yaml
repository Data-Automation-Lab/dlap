# INDEPENDENT COVERAGE SPEC. READ-ONLY FOR PARSER PACKAGES.
#
# This file is the denominator of the cloudtrail coverage score (com.dlap.fixtures.CoverageSpec).
# It was written from the AWS documentation by a package that does not build the parser (SPEC-01).
# Parser and fixture packages use these ids in meta.yaml and never edit this file. A change goes in
# its own commit, with no parser code and no fixture case in it;
# scripts/ci-guards/post-test/coverage-spec-lock.sh fails any other commit.
#
# CT-01 claims 1.08 to 1.11 (score at least 0.99). Older minors are listed for the s3-file envelope
# so replayed archives have a denominator; nobody claims them yet.

spec: dlap-coverage-spec/1
family: cloudtrail
title: AWS CloudTrail records (management and data events), as trail files, LookupEvents results and EventBridge events
source_kind: AWS_CLOUDTRAIL
written_by: SPEC-01
written_on: "2026-10-19"
research:
  - "Hardening research, AWS log sources report (2026-10-18): sections 3 to 6, 10 and 14 (parser contract)"
  - "Hardening research, log layer design (2026-10-18): B1 envelopes, B7 required coverage"
  - "docs/specs/log-event.md (LOG-01 contract): native key eventID, sharedEventID usage dedup, supersedes_event_id"
operation_id_rule: "<eventSource>:<eventName>, exactly as the record spells them (log-event.md section 4.1, field 7)."
version_rule: >-
  eventVersion is a major.minor string. Major 1 is accepted with any minor; a newer minor parses as the highest
  known minor with a NEWER_MINOR warning; any other major is quarantined. Fields have been added without a bump
  and AWS's own samples mismatch version and fields, so parse by field presence (research section 0).
notes: >-
  Not scored here: CloudWatch Logs delivery (whether a message is the bare record is unverified), CloudTrail Lake
  (closed to new customers 2026-05-31, legacy connector only), S3 server access logs, S3 Inventory and S3
  Metadata (separate families). Insight, NetworkActivity, Aggregated and Digest records are routed away from the
  standard parser; they appear below only as negative routing variants.

envelopes:
  - id: s3-file
    title: Trail file in S3, gzip JSON {"Records":[...]} under AWSLogs/<account>/CloudTrail/<region>/YYYY/MM/DD/
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-log-file-examples.html
    versions: ["1.0", "1.01", "1.02", "1.03", "1.04", "1.05", "1.06", "1.07", "1.08", "1.09", "1.10", "1.11"]
  - id: lookup-events
    title: LookupEvents result, an SDK Event whose CloudTrailEvent string is the record; management and Insights events only, 90 days
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/APIReference/API_LookupEvents.html
    versions: ["1.08", "1.09", "1.10", "1.11"]
  - id: eventbridge-detail
    title: EventBridge event (version "0") whose detail is the record; detail-type AWS API Call via CloudTrail and others
    doc_url: https://docs.aws.amazon.com/eventbridge/latest/userguide/eb-service-event-cloudtrail.html
    versions: ["1.08", "1.09", "1.10", "1.11"]
  - id: cloudwatch-line
    title: CloudWatch Logs message, one record per log event in stream <account>_CloudTrail_<region>
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/send-cloudtrail-events-to-cloudwatch-logs.html
    versions: ["1.08", "1.09", "1.10", "1.11"]
    status: unverified
    reason: Whether a message holds the bare record with no Records wrapper is unconfirmed (AWS report section 15, item 5); confirm with a capture (LIVE-02)

versions:
  - id: "1.0"
    title: Base fields (eventTime, eventVersion, userIdentity, eventSource, eventName, awsRegion, sourceIPAddress)
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.0"
    required_fields: [eventTime, eventVersion, userIdentity, eventSource, eventName, awsRegion, sourceIPAddress]
  - id: "1.01"
    title: Adds requestID, eventID, readOnly, resources[] and apiVersion
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.01"
    required_fields: [eventTime, eventVersion, userIdentity, eventSource, eventName, awsRegion, sourceIPAddress, eventID]
  - id: "1.02"
    title: Adds eventType and recipientAccountId
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.02"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity]
  - id: "1.03"
    title: Adds sharedEventID
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.03"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity]
  - id: "1.04"
    title: Adds vpcEndpointId
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.04"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity]
  - id: "1.05"
    title: Adds serviceEventDetails; records capped at 256 KB from this version
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.05"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity]
  - id: "1.06"
    title: Adds managementEvent
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.06"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity]
  - id: "1.07"
    title: Adds eventCategory (Management, Data, NetworkActivity)
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.07"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity, eventCategory]
  - id: "1.08"
    title: Adds addendum, sessionCredentialFromConsole, edgeDeviceDetails and tlsDetails
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.08"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity, eventCategory]
  - id: "1.09"
    title: Adds vpcEndpointAccountId
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.09"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity, eventCategory]
  - id: "1.10"
    title: Announced 2024-03-26 in the document history; no record field carries Since 1.10
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-document-history.html
    detect: eventVersion "1.10"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity, eventCategory]
  - id: "1.11"
    title: Current version; adds eventContext (event data stores only) and userIdentity.inScopeOf
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    detect: eventVersion "1.11"
    required_fields: [eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity, eventCategory]

