variants:
  # ---------------------------------------------------------------- record and version
  - id: record.invalid-json
    title: Input that is not valid JSON is quarantined, never dropped silently
    negative: true
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: Log layer design B3
  - id: record.missing-required
    title: A record missing a required field (eventTime, eventSource, eventName, awsRegion, eventID, eventType, userIdentity) is quarantined
    negative: true
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report sections 0 and 14
  - id: record.unknown-fields
    title: Unknown fields are ignored and counted, never a rejection
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report sections 0 and 12
  - id: version.unknown-major
    title: eventVersion with a major other than 1 (for example 2.0) is quarantined as UNKNOWN_MAJOR_VERSION
    negative: true
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report section 0; CT-01 acceptance
  - id: version.newer-minor
    title: An eventVersion minor above 1.11 parses as 1.11 with a NEWER_MINOR warning
    versions: ["1.11"]
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report section 0; log layer design B1
  - id: version.fields-ahead-of-version
    title: A record carries fields newer than its eventVersion (AWS's S3 sample is 1.03 with tlsDetails); parse by field presence
    doc_url: https://docs.aws.amazon.com/AmazonS3/latest/userguide/cloudtrail-logging-understanding-s3-entries.html
    research: AWS report sections 0 and 14
  - id: version.fields-added-without-bump
    title: userIdentity.signInSessionArn, invokedByDelegate, BuilderIdUser and tlsDetails.keyExchange appear without a version bump
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-document-history.html
    research: AWS report section 0
  - id: field.read-only-management-absent
    title: readOnly and managementEvent absent (pre-1.06 or non-API events); neither is required
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report section 3.1
  - id: field.event-category-absent
    title: A pre-1.07 record has no eventCategory; the category comes from the classification table
    versions: ["1.0", "1.01", "1.02", "1.03", "1.04", "1.05", "1.06"]
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report section 3.1
  - id: field.request-parameters-omitted
    title: requestParameters omitted (above 100 KB) and responseElements null (read-only APIs); the record still parses
    doc_url: https://docs.aws.amazon.com/awscloudtrail/latest/userguide/cloudtrail-event-reference-record-contents.html
    research: AWS report sections 3.1 and 14
  - id: field.additional-event-data-omitted
    title: additionalEventData omitted above 28 KB
