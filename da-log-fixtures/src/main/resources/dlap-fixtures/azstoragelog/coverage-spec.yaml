# INDEPENDENT COVERAGE SPEC. READ-ONLY FOR PARSER PACKAGES.
#
# This file is the denominator of the azstoragelog coverage score (com.dlap.fixtures.CoverageSpec).
# It was written from Microsoft Learn documentation by a package that does not build the parser
# (SPEC-01). Parser and fixture packages use these ids in meta.yaml and never edit this file. A
# change goes in its own commit, with no parser code and no fixture case in it;
# scripts/ci-guards/post-test/coverage-spec-lock.sh fails any other commit.

spec: dlap-coverage-spec/1
family: azstoragelog
title: Azure Storage resource logs for Blob and ADLS Gen2 (StorageRead, StorageWrite, StorageDelete)
source_kind: AZURE_STORAGE_RESOURCE_LOG
written_by: SPEC-01
written_on: "2026-10-19"
research:
  - "Hardening research, Azure log sources report (2026-10-18): section 3 (Source B), section 8 (version-tolerant parsing) and section 9 (parser contract)"
  - "OpenTelemetry azureencodingextension README (Apache-2.0), opened 2026-10-19"
  - "docs/specs/log-event.md (LOG-01 contract): native key AZURE_STORAGE_RESOURCE_LOG|correlationId|operationCount"
operation_id_rule: "StorageBlobLogs:<operationName>, with operationName exactly as the record spells it (OperationName in Log Analytics). The prefix is the table all three categories map to; the category never classifies an operation, because the operation-to-category mapping is not published."
version_rule: >-
  schemaVersion (the SchemaVersion column in Log Analytics) is the version; only 1.0 is documented and no change
  history is published. operationVersion (the storage service version, x-ms-version) is a second axis, covered
  as a variant. A missing or unknown schemaVersion is quarantined.
notes: >-
  Not scored here: classic Storage Analytics $logs (semicolon-delimited, its own version field), Event Grid blob
  events (no read events exist), blob inventory and last-access-time tracking (the azinventory family, AZ-01), and
  the Activity Log (the azactivity family).

envelopes:
  - id: resource-log
    title: Diagnostic-settings export delivered to Event Hubs, a message body {"records":[...]} and the array forms consumers see
    doc_url: https://learn.microsoft.com/en-us/azure/azure-monitor/data-collection/stream-monitoring-data-event-hubs
    versions: ["1.0"]
  - id: resource-log-jsonl
    title: Diagnostic-settings export to a storage account, PT1H.json append blobs in JSON Lines (since 2018-11-01)
    doc_url: https://learn.microsoft.com/en-us/azure/azure-monitor/logs/resource-logs
    versions: ["1.0"]
  - id: log-analytics-row
    title: Row of the StorageBlobLogs table in Log Analytics (TimeGenerated, OperationName, StatusCode as a string)
    doc_url: https://learn.microsoft.com/en-us/azure/azure-monitor/reference/tables/storagebloblogs
    versions: ["1.0"]

versions:
  - id: "1.0"
    title: Storage resource log schema 1.0, the only documented schemaVersion
    doc_url: https://learn.microsoft.com/en-us/azure/storage/blobs/monitor-blob-storage-reference
    detect: schemaVersion (export) or SchemaVersion (Log Analytics) equals 1.0
    required_fields: [time, resourceId, category, operationName, statusCode, "properties.accountName or resourceId"]
    optional_fields: [identity.requester, identity.type, identity.tokenHash, identity.authorization, identity.properties.objectKey, uri, callerIpAddress, correlationId, properties.operationCount, properties.requestUrl, properties.userAgentHeader, operationVersion]

operations:
  # ---------------------------------------------------------------- reads
  - id: StorageBlobLogs:GetBlob
    expected_category: DATA_READ
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3, read versus write signals (200 or 206)
  - id: StorageBlobLogs:QueryBlobContents
    expected_category: DATA_READ
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:ReadFile
    expected_category: DATA_READ
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (ADLS Gen2 dfs operation)
  # ---------------------------------------------------------------- listings and metadata reads (not data reads)
  - id: StorageBlobLogs:ListBlobs
    expected_category: MANAGEMENT
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (list operations are not data reads)
  - id: StorageBlobLogs:ListFilesystemFile
    expected_category: MANAGEMENT
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:GetBlobProperties
    expected_category: MANAGEMENT
    doc_url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
    research: Azure report sections 3 and 4 (does not update last access time)
  - id: StorageBlobLogs:GetBlobMetadata
    expected_category: MANAGEMENT
    doc_url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
    research: Azure report sections 3 and 4
  - id: StorageBlobLogs:GetBlobTags
    expected_category: MANAGEMENT
    doc_url: https://learn.microsoft.com/en-us/azure/storage/blobs/lifecycle-management-policy-structure
    research: Azure report sections 3 and 4
  # ---------------------------------------------------------------- writes
  - id: StorageBlobLogs:PutBlob
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3; create versus overwrite cannot be told apart (section 8)
  - id: StorageBlobLogs:PutBlock
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:PutBlockList
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:AppendBlock
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:CreatePathFile
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (dfs)
  - id: StorageBlobLogs:AppendFile
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (dfs)
  - id: StorageBlobLogs:FlushFile
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (dfs)
  - id: StorageBlobLogs:CopyBlob
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3
  - id: StorageBlobLogs:CopyBlobSource
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (internal entry that only exists in logging data)
  - id: StorageBlobLogs:CopyBlobDestination
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (internal entry that only exists in logging data)
  - id: StorageBlobLogs:SetBlobTier
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (listed among write operations)
  - id: StorageBlobLogs:SetBlobMetadata
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
