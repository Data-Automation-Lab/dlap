    research: Azure report section 3 (dfs)
  - id: StorageBlobLogs:DeleteDirectory
    expected_category: DATA_WRITE
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
    research: Azure report section 3 (dfs)
  - id: StorageBlobLogs:DeleteContainer
    doc_url: https://learn.microsoft.com/en-us/rest/api/storageservices/storage-analytics-logged-operations-and-status-messages
