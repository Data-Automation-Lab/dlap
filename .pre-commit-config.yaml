# pre-commit hooks for DLAP (work package CI-02a). Optional for contributors,
# enforced in CI by the "Secret scan" job in .github/workflows/dlap-ci-cd.yml.
#
# One-time setup (see CONTRIBUTING.md, section Secret scanning):
#   pip install pre-commit
#   pre-commit install
#
# gitleaks scans the staged changes of each commit with the same configuration
# as CI (.gitleaks.toml). The hook is built from the gitleaks source at the
# pinned commit, so it needs no Docker and works inside git worktrees.
#
# Keep the version in step with GITLEAKS_IMAGE in the CI workflow: when you bump
# one, bump the other. The rev is the commit of the release tag, written as a
# SHA so that a moved tag cannot change what runs on a contributor machine.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
        # --ignore-gitleaks-allow matches CI: inline "gitleaks:allow" comments
        # are not honoured, exceptions live in .gitleaks.toml only.
        args: ["--config=.gitleaks.toml", "--ignore-gitleaks-allow"]
