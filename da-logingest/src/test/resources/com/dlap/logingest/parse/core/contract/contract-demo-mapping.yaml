# Mapping of the invented contract-demo shape. It exercises the parts of the contract the selftest
# shape cannot: canonical asset ids through AssetIdNormalizer, an asset-kind that must resolve, a
# record id as native key, principal types, a newer minor and a documented fallback clock. Test
# data only.
spec-version: 1
family: contract-demo
source-kind: DLAP_CONTRACT_DEMO
source-provider: AWS
settings:
  persist-raw: SAMPLED
  persist-raw-sample-one-in: 10
envelopes:
  - id: generic-json
    framing: [record, json-lines, json-object-array]
    records-pointer: /records
    version-detection:
      scheme: major-minor
      pointer: /v
    native-key:
      parts:
        - pointer: /id
    fields:
      event-time: /at
      observed-time: /receivedAt
      service: /svc
      operation: /op
      principal.id: [/who/arn, /who/name]
      principal.type: /who/type
      principal.account-id: /who/account
      target.id: /object
      request.caller-ip: /ip
      shared-event-id: /sharedId
    time-fallback: [/receivedAt]
    required: [target.id]
    result:
      failure-when:
        - pointer: /error
          present: true
        - pointer: /checks/*/granted
          equals: false
    skip-when:
      - reason: NOT_AN_EVENT
        when:
          - pointer: /kind
            equals: heartbeat
    principal-types:
      AssumedRole: ROLE
      IAMUser: USER
      AWSService: SYSTEM
    classification:
      rules:
        - service: store
          operation: GetObject
          change-type: ACCESS
          category: DATA_READ
          asset-kind: S3_OBJECT
        - service: store
          operation-prefix: Put
          change-type: UPDATE
          category: DATA_WRITE
          asset-kind: S3_OBJECT
    versions:
      - id: "1.0"
      - id: "1.2"
        description: Adds the caller checks list.
        known-paths: [/checks]
extensions:
  note: free-form family settings are allowed here
