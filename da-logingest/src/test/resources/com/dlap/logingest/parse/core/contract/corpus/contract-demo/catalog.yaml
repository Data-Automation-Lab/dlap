#
# Self-test corpus of the parser contract test base (LOG-02a). The record shape is invented, so the
# harness can exercise canonical ids, newer minors, fallback clocks, skips and pass-through
# quarantines without any vendor format.
family: contract-demo
description: Invented record shape that exercises the parser contract test base.
envelopes:
  - id: generic-json
    versions:
      - id: "1.0"
        supported: true
        operations: [store:GetObject, store:PutObject]
        variants: [demo-object-array, demo-newer-minor, demo-time-fallback, demo-failure, demo-heartbeat, demo-missing-target, demo-unknown-major]
