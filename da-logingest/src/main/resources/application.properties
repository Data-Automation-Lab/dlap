# DLAP da-logingest Service Configuration
# M2 / R-P1-10. Cloud-neutral audit-log normalization service.

spring.application.name=da-logingest
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
server.port=8090

# Database - per CLAUDE.md sec.6: each service owns its own Postgres schema.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/da_logingest
spring.datasource.username=${DB_USER:da_logingest_user}
spring.datasource.password=${DB_PASS:da_logingest_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA - validate-only in prod per CLAUDE.md sec.6.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=dlap_logingest
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway - sequential V1..Vn per service.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dlap_logingest
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Kafka - produces dlap.log.event.normalized; consumes replay-trigger
# events (M3+).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=da-logingest-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# SEC-03: a closed list, never a wildcard. The consumers of this service read values as Object or String and
# ignore type headers (KAFKA-01), so the list is a second lock behind the first.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dlap.common.logevent
# Q-029: cap a client-supplied page size (Spring Data allows 2000 by default).
spring.data.web.pageable.max-page-size=200
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Idempotent producer per CLAUDE.md sec.11.
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.acks=all

# Security via Keycloak (same realm as the rest of DLAP).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Actuator.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.endpoint.health.probes.enabled=true

# Logging.
logging.level.com.dlap=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n

# DLAP service metadata.
dlap.service.name=Da-logingest Service
dlap.service.version=1.0.0
dlap.service.description=Cloud-neutral audit-log normalizer per ADR-0003 / R-P1-10.

# da-logingest-specific knobs.
# Ingest pipeline (ADR-0045 decision 8, ADR-0054, ADR-0060): legacy (the default: the
# per-cloud sources under source/** and the DTO ingest service) or registry (transports,
# REST ingest and fixture replay go through the parser registry with the bindings file
# below). Any other value fails startup. See docs/guides/log-sources.md.
dlap.logingest.pipeline=${DLAP_LOGINGEST_PIPELINE:legacy}

# Bindings file (design B2): sources, bindings and streams under dlap.logingest.*, in a YAML
# or properties file named by DLAP_LOGINGEST_SOURCES_FILE (default /etc/dlap/log-sources.yml;
# Spring Boot refuses an import placeholder that resolves to nothing). Optional: without the
# file there are no configured bindings. Example: deployment/examples/log-sources/README.md.
spring.config.import=optional:file:${DLAP_LOGINGEST_SOURCES_FILE:/etc/dlap/log-sources.yml}
# auto: a configuration error fails startup under the prod profile and is a warning (the
# binding does not run) under any other profile; strict: always fail; warn: never fail.
dlap.logingest.config-validation=${DLAP_LOGINGEST_CONFIG_VALIDATION:auto}

# Retention window for the local replay store, by ingest time (ADR-0060). log_events is
# partitioned by month of ingest_time; LogEventRetentionSweeper (a ShedLock singleton) drops
# every month whose whole range is older than this, on the cron below, so a row lives between
# retention-days and retention-days plus one month. A non-positive value disables pruning (it
# never means "delete everything"); retention-enabled=false turns pruning off. Partitions for
# the current month and retention-partitions-ahead months are created at startup and on every
# run either way. Pruning touches only the local replay copy; published Kafka events are
# unaffected.
dlap.logingest.retention-days=${LOGINGEST_RETENTION_DAYS:90}
dlap.logingest.retention-enabled=${LOGINGEST_RETENTION_ENABLED:true}
dlap.logingest.retention-cron=${LOGINGEST_RETENTION_CRON:0 30 3 * * ?}
dlap.logingest.retention-partitions-ahead=${LOGINGEST_RETENTION_PARTITIONS_AHEAD:2}

# AWS CloudTrail audit-log source (v0.2.0, ADR-0023). Pull-based; polls
# the CloudTrail LookupEvents API per region and publishes normalized
# DlapLogEvents to Kafka. Off by default; also requires the 'aws' (or
# 'prod') profile to be active. Credentials resolve via the AWS default
# chain (env keys + IMDS) unless static keys are set below.
dlap.logingest.aws.enabled=${DLAP_LOGINGEST_AWS_ENABLED:false}
dlap.logingest.aws.regions=${DLAP_LOGINGEST_AWS_REGIONS:}
dlap.logingest.aws.poll-cron=${DLAP_LOGINGEST_AWS_POLL_CRON:0/60 * * * * ?}
dlap.logingest.aws.max-results=${DLAP_LOGINGEST_AWS_MAX_RESULTS:50}
dlap.logingest.aws.initial-lookback-minutes=${DLAP_LOGINGEST_AWS_LOOKBACK_MINUTES:60}
dlap.logingest.aws.endpoint=${DLAP_LOGINGEST_AWS_ENDPOINT:}
dlap.logingest.aws.access-key=${DLAP_LOGINGEST_AWS_ACCESS_KEY:}
dlap.logingest.aws.secret-key=${DLAP_LOGINGEST_AWS_SECRET_KEY:}

# AWS S3 log transports of the registry pipeline (AWS-01, providers/aws/s3): S3_TRAIL_FILES
# (CloudTrail trail files, AWS_CLOUDTRAIL/s3-file) and S3_SERVER_ACCESS_LOGS (S3 server access
# log text objects, AWS_S3_SERVER_ACCESS_LOG/cwl-json). Off by default. On, they only register;
# a stream in the bindings file names the bucket, prefix, region and endpoint, and credentials
# come from the AWS default chain or a named profile. Separate from the legacy source above.
dlap.logingest.transports.aws.enabled=${DLAP_LOGINGEST_TRANSPORTS_AWS_ENABLED:false}
# Streams that read these transports (and the GCS sink) are declared in the bindings file, not here;
# docs/guides/log-sources.md section 5.2 has the location keys and an example with an assumed role
# (credentials-ref is an IAM role ARN, never a secret; an invalid one fails its partition at every
# poll until it is fixed, section 5.2.1).

# Read failures of one object (section 5.3). After this many failed reads of the same object version
# the object is quarantined as READ_FAILED, checkpointed and skipped, in a stream poll and in a
# backfill job alike. The count is processed_object.attempts, so it also includes earlier ingest
# failures of that object version and transient read errors. A backfill job whose
# dlap.logingest.backfill.max-attempts is not above this cap can fail before the object reaches it.
dlap.logingest.transports.max-read-attempts=${DLAP_LOGINGEST_TRANSPORTS_MAX_READ_ATTEMPTS:5}

# Synthetic-event demo seeder (E2E / demo). When true, da-logingest emits
# ~50 synthetic GCS/BigQuery audit events on boot through the real ingest
# pipeline. Explicit placeholder so the DLAP_LOGINGEST_DEMO_SEED_ENABLED env
# var binds reliably to the hyphenated property name.
dlap.logingest.demo-seed.enabled=${DLAP_LOGINGEST_DEMO_SEED_ENABLED:false}

# Cross-cloud offline fixture replay (E2E / demo). When enabled, da-logingest
# replays per-cloud normalized-event fixtures (arrays of IngestRequestDTO) from
# a directory through the real ingest pipeline in-process - no cloud creds, no
# auth token. Off by default; set the dir to a fixtures folder and, optionally,
# a provider filename-prefix (aws|gcp|azure) to replay a single cloud.
dlap.logingest.replay.enabled=${DLAP_LOGINGEST_REPLAY_ENABLED:false}
dlap.logingest.replay.dir=${DLAP_LOGINGEST_REPLAY_DIR:}
dlap.logingest.replay.provider=${DLAP_LOGINGEST_REPLAY_PROVIDER:}
# Registry pipeline only: the replay runs on every start and skips events already stored.
# true re-publishes stored fixtures on purpose (IngestMode REPLAY, origin ORIGIN_REPLAY).
dlap.logingest.replay.republish-stored=${DLAP_LOGINGEST_REPLAY_REPUBLISH_STORED:false}

# Active profile.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
