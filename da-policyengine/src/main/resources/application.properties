# DLAP Policy Engine Service Configuration
# Updated to use the DLAP infrastructure

spring.application.name=da-policyengine
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Server Configuration
server.port=8080
# No context-path: every controller already maps the full /api/v1/policyengine/...
# path. A context-path here doubled every route (/api/v1/policyengine/api/v1/
# policyengine/...) and 404'd all cross-service REST / Feign / UI calls.

# Database Configuration - using infrastructure PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/da_policyengine
spring.datasource.username=${DB_USER:da_policyengine_user}
spring.datasource.password=${DB_PASS:da_policyengine_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=dlap_policyengine
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dlap_policyengine
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Kafka Configuration - using infrastructure Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${spring.application.name}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# SEC-03: a closed list, never a wildcard. The consumers of this service read values as Object or String and
# ignore type headers (KAFKA-01), so the list is a second lock behind the first.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dlap.common.logevent
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.retries=3
spring.kafka.producer.acks=all

# Security Configuration - using infrastructure Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs

# Pagination hardening: cap client-supplied page size to prevent unbounded queries (DoS)
spring.data.web.pageable.max-page-size=200

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.endpoint.health.probes.enabled=true

# Logging Configuration
logging.level.com.dlap=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n

# DLAP Specific Configuration
dlap.service.name=Policy Engine Service
dlap.service.version=1.0.0
dlap.service.description=Policy evaluation and enforcement engine

# Common entities database connection (for da-protos entities)
dlap.common-db.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/dlap_common
dlap.common-db.username=${DB_USER:dlap_common_user}
dlap.common-db.password=${DB_PASS:dlap_common_pass}

# Kafka topics
dlap.kafka.topics.policy-actions=dlap.policies.actions
dlap.kafka.topics.policy-evaluations=dlap.policies.evaluations

# Custom application properties for Kafka topics
app.kafka.topic.policy-action-event=dlap.policies.actions

# Event-path catalog cache (POL-05, Q-437): the lifecycle event consumer reads the catalog (URI to id, then the
# asset) once per event. Answers are served for at most ttl (an entry as old as ttl is looked up again), so the
# P2D coverage freshness rule still holds. Empty answers are never stored. ttl=PT0S turns the cache off.
dlap.policyengine.catalog-cache.ttl=${DLAP_POLICYENGINE_CATALOG_CACHE_TTL:PT30S}
dlap.policyengine.catalog-cache.max-entries=${DLAP_POLICYENGINE_CATALOG_CACHE_MAX_ENTRIES:10000}

# da-catalog (Feign) - set bearer-token for Keycloak service account in production
dlap.services.catalog.url=http://localhost:8082
dlap.services.catalog.bearer-token=${DA_CATALOG_BEARER_TOKEN:}

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.da-catalog.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.da-catalog.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.da-catalog.sliding-window-size=10

# Easy Rules Configuration
easy.rules.skipOnFirstAppliedRule=false
easy.rules.skipOnFirstFailedRule=false
easy.rules.rulePriorityThreshold=1

# CORS Configuration
dlap.security.allowed-origins=http://localhost:3000,http://localhost:4200

# JWT Claims Configuration
dlap.security.jwt.claims.user-id=sub
dlap.security.jwt.claims.username=preferred_username
dlap.security.jwt.claims.roles=realm_access.roles

# OpenAPI Documentation
springdoc.api-docs.path=/api/v1/policyengine/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true

# Event Center Configuration
dlap.event-center.enabled=true
dlap.event-center.max-events-per-stream=100
dlap.event-center.analytics-cache-duration=300
dlap.event-center.notification-retry-attempts=3
dlap.event-center.notification-timeout-ms=5000

# Event Center Kafka Topics
dlap.kafka.topics.event-stream=dlap.events.stream
dlap.kafka.topics.event-notifications=dlap.events.notifications
dlap.kafka.topics.event-analytics=dlap.events.analytics

# WebSocket Configuration for Event Streaming
spring.websocket.enabled=true
dlap.websocket.event-stream-endpoint=/ws/events
dlap.websocket.allowed-origins=http://localhost:3000,http://localhost:4200

# Event Center Source Services
dlap.event-center.source-services=da-catalog,da-discovery,da-compliance,da-policyengine,da-reporting,da-governance,da-lifecycle,da-classification,da-lineage

# Policy Engine Configuration
dlap.policyengine.evaluation.parallel-threads=4
dlap.policyengine.evaluation.timeout-seconds=300
dlap.policyengine.evaluation.batch-size=100
dlap.policyengine.evaluation.retry-attempts=3
dlap.policyengine.evaluation.retry-delay-ms=1000

# Rule Engine Configuration
dlap.policyengine.rules.cache-size=1000
dlap.policyengine.rules.cache-ttl-seconds=3600
dlap.policyengine.rules.max-complexity=1000
dlap.policyengine.rules.enable-debug=false

# Event Center Configuration
dlap.policyengine.events.enabled=true
dlap.policyengine.events.batch-size=50
dlap.policyengine.events.flush-interval-ms=5000
dlap.policyengine.events.retry-attempts=3
dlap.policyengine.events.retry-delay-ms=1000

# Policy actions and the scheduled sweep (POL-01, docs/specs/policy-dsl.md)
# actions.enabled=false is shadow mode: matches are logged and counted in
# policyengine.actions.shadowed, nothing is published on dlap.policies.actions.
dlap.policyengine.actions.enabled=${DLAP_POLICYENGINE_ACTIONS_ENABLED:true}
# Schedule triggers fire through ScheduledPolicySweeper (ShedLock lock policy-schedule-sweeper).
# lock-at-most-for must stay above twice the longest sweep (plan rule R7).
dlap.policyengine.schedule.enabled=${DLAP_POLICYENGINE_SCHEDULE_ENABLED:true}
dlap.policyengine.schedule.tick=PT30S
dlap.policyengine.schedule.initial-delay=PT30S
dlap.policyengine.schedule.lock-at-most-for=PT1H
dlap.policyengine.schedule.lock-at-least-for=PT5S
dlap.policyengine.schedule.zone=UTC
dlap.policyengine.schedule.page-size=200
dlap.policyengine.schedule.max-assets-per-sweep=100000
dlap.policyengine.schedule.statuses=ACTIVE,ARCHIVED
# How long a sweep waits for the broker to acknowledge its actions; a send not acknowledged in
# time counts as failed and the slot stays due (POL-02, Q-439).
dlap.policyengine.schedule.send-timeout=PT60S
# Where full read coverage is required (destructive and retention-shortening actions,
# AccessPolicies), a FULL observed longer ago than this counts as unknown coverage (POL-02, Q-475).
dlap.policy.coverage.max-age=${DLAP_POLICY_COVERAGE_MAX_AGE:P2D}

# Approvals and dual control (APPR-01, docs/specs/approvals.md)
# Destructive fires (archive, soft delete, hard delete) of the event and schedule paths wait for N
# distinct approvers; requireApproval: true makes any action wait. Floors are enforced at start-up
# and in the database: hard delete never needs fewer than 2.
dlap.policyengine.approvals.ttl=${DLAP_APPROVALS_TTL:P7D}
dlap.policyengine.approvals.required.archive=${DLAP_APPROVALS_REQUIRED_ARCHIVE:1}
dlap.policyengine.approvals.required.soft-delete=${DLAP_APPROVALS_REQUIRED_SOFT_DELETE:1}
dlap.policyengine.approvals.required.hard-delete=${DLAP_APPROVALS_REQUIRED_HARD_DELETE:2}
dlap.policyengine.approvals.required.other=${DLAP_APPROVALS_REQUIRED_OTHER:1}
dlap.policyengine.approvals.approver-roles=${DLAP_APPROVALS_APPROVER_ROLES:ADMIN,CDO,DIRECTOR,POLICY_MANAGER}
# true in production: a decision needs the dlap-mfa-required realm role in the token (IAM-02 template).
dlap.policyengine.approvals.require-mfa-marker=${DLAP_APPROVALS_REQUIRE_MFA_MARKER:false}
dlap.policyengine.approvals.mfa-marker-role=dlap-mfa-required
dlap.policyengine.approvals.break-glass.enabled=${DLAP_APPROVALS_BREAK_GLASS_ENABLED:true}
dlap.policyengine.approvals.break-glass.min-justification-length=20
dlap.policyengine.approvals.max-comment-length=2000
# Expiry and the outbox relay run in one ShedLock job (lock approval-maintenance); keep
# lock-at-most-for above twice the worst tick (relay-batch-size x send-timeout).
dlap.policyengine.approvals.maintenance.enabled=true
dlap.policyengine.approvals.maintenance.tick=PT5S
dlap.policyengine.approvals.maintenance.initial-delay=PT20S
dlap.policyengine.approvals.maintenance.lock-at-most-for=PT10M
dlap.policyengine.approvals.maintenance.lock-at-least-for=PT1S
dlap.policyengine.approvals.relay-batch-size=50
dlap.policyengine.approvals.send-timeout=PT5S

# Consumed-stage AuthZEN PDP (ADR-0040)
# default-decision: applied only when no AccessPolicy matches the request.
# 'deny' (shipped, fail-closed) or 'allow' (observe / brownfield mode --
# AccessDecisionService logs a WARN at startup when set to 'allow'). An
# explicit deny in a matching policy always overrides, regardless of this
# setting. The code default is already 'deny'
# (AccessDecisionService.java:112 @Value("${dlap.pdp.default-decision:deny}"));
# this line makes it explicit and overridable per deployment.
# See docs/specs/enforcement-contract.md and docs/architecture/overview.md S4.
dlap.pdp.default-decision=${DLAP_PDP_DEFAULT_DECISION:deny}
