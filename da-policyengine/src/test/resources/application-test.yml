# Test configuration for da-policyengine integration tests
spring:
  application:
    name: da-policyengine-test
  
  # Database configuration (using H2 for tests)
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: password
    hikari:
      auto-commit: false
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          lob:
            non_contextual_creation: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false
      
  # Disable Liquibase for tests
  liquibase:
    enabled: false
    
  # Disable Docker for tests
  docker:
    compose:
      enabled: false

  # Task execution configuration for tests
  task:
    execution:
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      thread-name-prefix: test-task-
    
  # Cache configuration for tests
  cache:
    type: simple

# Disable Docker for tests
testcontainers:
  enabled: false

# Security configuration for tests
dlap:
  security:
    jwt:
      enabled: false
    oauth2:
      enabled: false

# Kafka configuration for tests (disabled)
spring:
  kafka:
    enabled: false
    bootstrap-servers: localhost:9092
    consumer:
      group-id: da-policyengine-test
      auto-offset-reset: earliest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
