# ---------------------------------------------------------------------------
# Scale and soak override (E2E-02, decision D39), layered on the dev compose pair and
# docker-compose.e2e.yml by e2e-tests/perf/run.sh.
#
#   perf-localstack  an S3 emulator that holds the generated CloudTrail trail files. Its port is
#                    published on the host (DLAP_PERF_S3_PORT) only so the generator can upload to it.
#   da-logingest     runs the registry pipeline with the S3_TRAIL_FILES transport on that emulator
#                    (bindings file generated by run.sh and mounted from DLAP_PERF_CONFIG_DIR), with
#                    the backfill job settings the resume test needs.
#
# The fixture replay seeder of the e2e override stays off (DLAP_LOGINGEST_REPLAY_ENABLED=false, set by
# run.sh): it is single threaded and blocks application start, which would hold the stream pollers back.
# GCP and Azure events reach da-logingest through its REST channel instead. Nothing here can reach a real
# cloud: the only S3 endpoint is the emulator and the keys are its test pair.
# ---------------------------------------------------------------------------
services:
  perf-localstack:
    image: localstack/localstack:3.4
    environment:
      - SERVICES=s3
      - DEFAULT_REGION=us-east-1
      - SKIP_SSL_CERT_DOWNLOAD=1
    ports:
      - "${DLAP_PERF_S3_PORT:-14566}:4566"
    networks:
      - dlap-network

  da-logingest:
    environment:
      - DLAP_LOGINGEST_PIPELINE=registry
      - DLAP_LOGINGEST_TRANSPORTS_AWS_ENABLED=true
      - DLAP_LOGINGEST_SOURCES_FILE=/perf/log-sources.yml
      - DLAP_LOGINGEST_BACKFILL_MAX_BATCHES_PER_SECOND=${DLAP_PERF_BF_BATCHES_PER_SEC:-0.5}
      - DLAP_LOGINGEST_BACKFILL_MAX_WINDOW=${DLAP_PERF_BF_MAX_WINDOW:-P90D}
      - DLAP_LOGINGEST_BACKFILL_POLL_INTERVAL=PT5S
      # The application scheduler has one thread by default, so the streams of all bindings would be polled
      # one after the other. One thread per CloudTrail stream lets them read in parallel.
      - SPRING_TASK_SCHEDULING_POOL_SIZE=${DLAP_PERF_SCHED_POOL:-8}
      # The pool holds 10 connections by default. A stream poll keeps one for its advisory lock while its
      # ingest needs more, and every concurrent REST push needs one, so 10 starved a first run (requests timed out
      # waiting for a connection). One connection per concurrent writer plus headroom.
      - DB_POOL_SIZE=${DLAP_PERF_DB_POOL:-40}
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_EC2_METADATA_DISABLED=true
    volumes:
      - ${DLAP_PERF_CONFIG_DIR}:/perf:ro
