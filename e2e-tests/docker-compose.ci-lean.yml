# ---------------------------------------------------------------------------
# CI lean mode for the lifecycle harness (CI-03, Q-787, decision D41).
#
# Layered last on the dev compose pair, docker-compose.e2e.yml and, for the aws run,
# docker-compose.lifecycle-aws.yml, only when cloud-lifecycle-e2e.sh runs with
# DLAP_E2E_CI_LEAN=1 (the lifecycle-aws CI job sets it). The hosted runner has 7.9 GB of memory
# and 3 GB of swap; the second CI run of the harness was killed (exit 137) when LocalStack started
# next to the whole stack. This file bounds every container so the stack fits with room to spare:
#
#   * Every Java service gets a heap ceiling (-Xmx through JAVA_TOOL_OPTIONS; an explicit -Xmx
#     wins over the -XX:MaxRAMPercentage=75.0 that the Dockerfiles pass on the command line),
#     a metaspace, code cache and direct-memory ceiling, the C1 compiler only, and
#     -XX:+ExitOnOutOfMemoryError so a heap that is too small restarts the container loudly
#     instead of leaving a half-alive service. The collector is left to the Dockerfile
#     (-XX:+UseG1GC): naming another one here makes the JVM refuse to start.
#   * Every container gets mem_limit, and memswap_limit equal to it, so the cap is a real one and
#     the runner's swap cannot hide the use from the measurement.
#   * Postgres drops shared_buffers from 512 MB to 128 MB; Kafka and Keycloak get smaller heaps.
#
# The harness also stops the services the retire phase does not call before LocalStack starts
# (cloud-lifecycle-e2e.sh, LEAN_STOP_SERVICES) and samples `docker stats` every 5 s, so the peak total
# container memory of a run is a measured figure printed at the end.
#
# The sizes were set from a measured run; the result is in docs of the CI-03 change and in the
# harness output ("peak total container memory"). Raising a limit here raises the CI peak: re-measure.
# ---------------------------------------------------------------------------
services:
  postgresql:
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=128MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "maintenance_work_mem=32MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "log_min_duration_statement=1000"
      - "-c"
      - "log_connections=on"
      - "-c"
      - "log_disconnections=on"
      - "-c"
      - "log_statement=ddl"
    mem_limit: 512m
    memswap_limit: 512m

  kafka:
    environment:
      KAFKA_HEAP_OPTS: "-Xmx256M -Xms256M"
    mem_limit: 640m
    memswap_limit: 640m

  keycloak:
    environment:
      JAVA_OPTS_KC_HEAP: "-Xms128m -Xmx384m"
    mem_limit: 768m
    memswap_limit: 768m

  # Idle: da-autolabel runs the rules provider, so nothing calls Ollama. Stopped before the retire phase.
  ollama:
    mem_limit: 256m
    memswap_limit: 256m

  da-logingest:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx256m -Xms64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
    mem_limit: 576m
    memswap_limit: 576m

  da-discovery:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
    mem_limit: 608m
    memswap_limit: 608m

  da-catalog:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx224m -Xms64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
    mem_limit: 544m
    memswap_limit: 544m

  da-policyengine:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx224m -Xms64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
    mem_limit: 544m
    memswap_limit: 544m

  da-autolabel:
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx192m -Xms64m -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:MaxDirectMemorySize=64m -XX:TieredStopAtLevel=1 -Xss512k -XX:+ExitOnOutOfMemoryError"
    mem_limit: 512m
