# ---------------------------------------------------------------------------
# CI lean mode, LocalStack part (CI-03, Q-787). Layered after docker-compose.ci-lean.yml by
# cloud-lifecycle-e2e.sh when DLAP_E2E_CI_LEAN=1 and the aws retire phase is part of the run.
# It lives in its own file because e2e-localstack exists only in docker-compose.lifecycle-aws.yml;
# a service with no image in the lean overlay would break every other compose call.
# ---------------------------------------------------------------------------
services:
  e2e-localstack:
    mem_limit: 640m
    memswap_limit: 640m
