# Log source of the retire phase of `cloud-lifecycle-e2e.sh aws` (RET-08, Q-714): one CloudTrail
# binding reading trail files from the LocalStack bucket dlap-e2e-trail through the S3_TRAIL_FILES
# transport (AWS-01). Mounted read-only into da-logingest by docker-compose.lifecycle-aws.yml.
# The account id is the AWS documentation example; nothing here names a real account.
dlap:
  logingest:
    sources:
      - id: e2e-aws-cloudtrail
        kind: AWS_CLOUDTRAIL
        bindings:
          - id: e2e-aws-ct-123456789012
            scope: { account-id: "123456789012", regions: [us-east-1] }
            poll-interval: PT20S
            stream:
              transport: S3_TRAIL_FILES
              location: { bucket: dlap-e2e-trail, region: us-east-1, endpoint: "http://e2e-localstack:4566", path-style: "true" }
