# Alertmanager configuration of the DLAP monitoring stack (OBS-01).
#
# The only receiver is the null receiver: alerts are grouped, shown in the Prometheus and Alertmanager
# user interfaces, and sent nowhere. The dev and pilot stacks hold no mail server, chat webhook or pager
# credentials, and the repository must not hold any (CLAUDE.md section 10.2). To get notifications, add a
# receiver in your own copy of this file and route to it; docs/observability.md section 5 shows the
# shape for e-mail, a webhook and a chat tool, with every secret read from a file or a variable.
#
# Check it with amtool:
#   docker run --rm -v "$PWD/deployment/platform/alertmanager:/a:ro" --entrypoint amtool \
#     prom/alertmanager:v0.27.0 check-config /a/alertmanager.yml

global:
  resolve_timeout: 5m

route:
  receiver: 'null'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: 'null'

# A service that is down also trips its latency, heap and pool warnings. Keep only the root cause.
inhibit_rules:
  - source_matchers:
      - alertname = "ServiceDown"
    target_matchers:
      - severity = "warning"
      - service =~ ".+"
    equal: ['service']
