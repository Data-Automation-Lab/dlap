# Compose override of the full-stack restore drill (DR-02, stack-drill.sh). It is applied LAST, after the
# quickstart pair (deployment/environments/dev), the backup overlay of the pilot, and the e2e override
# (fixture replay, dry-run delete, mock archival), under the project name the harness lock derived, so it
# never touches a stack that belongs to someone else.
#   - the "off-host" store is an external named volume that survives the loss of the stack: stack A ships
#     to DR_STACK_REMOTE, a restored stack ships to a store of its own and reads the survivor read-only at
#     /source (the restore commands in docs/guides/backup-and-restore.md read from there),
#   - the agent copies WAL every 30 seconds instead of every 5 minutes, so the drill measures the RPO of a
#     short cycle (the guide states the arithmetic for the 300 s default).
# Variables: DR_STACK_REMOTE (this stack's off-host volume, mounted at /remote), DR_STACK_SOURCE (the lost
# stack's off-host volume, mounted read-only at /source). The drill exports both.

services:
  dlap-backup:
    environment:
      - DLAP_WAL_CYCLE_SECONDS=30
      - DLAP_BACKUP_RETRY_SECONDS=5
    volumes:
      - drill-remote:/remote
      - drill-source:/source:ro

volumes:
  drill-remote:
    external: true
    name: ${DR_STACK_REMOTE}
  drill-source:
    external: true
    name: ${DR_STACK_SOURCE}
