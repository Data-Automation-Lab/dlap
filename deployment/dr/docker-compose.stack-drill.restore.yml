# Keycloak import override of the full-stack restore drill (DR-02). A restored stack starts Keycloak with the
# realm export of the lost one instead of the baseline realm file in git: the export carries what was created
# at run time (users, password changes, client changes), which the git file does not. The volume is filled by
# keycloak-realm.sh restore and emptied by keycloak-realm.sh wipe once Keycloak has imported the realm.
# The mount replaces the baseline mount of the same container path in deployment/environments/dev.
# Variable: DR_STACK_KC_IMPORT (the name of the import volume).

services:
  keycloak:
    volumes:
      - kc-import:/opt/keycloak/data/import:ro

volumes:
  kc-import:
    external: true
    name: ${DR_STACK_KC_IMPORT}
