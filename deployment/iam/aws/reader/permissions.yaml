# AWS Reader role: the single source of truth (IAM-03). main.tf reads this file with
# yamldecode; reader-role.cfn.yaml repeats the list because CloudFormation cannot read a file,
# and da-discovery ReaderRoleTraceabilityTest fails when the two differ. The test also checks
# every call site, that every action is a List, Get, Describe or LookupEvents action, that object
# content (s3:GetObject) is readable only in the log buckets the operator names and query-result
# content nowhere, and that every AWS SDK file of da-discovery and da-logingest is cited here or
# listed under no_permission_sources.
#
# Scopes (main.tf and reader-role.cfn.yaml build one policy statement per scope):
#   account             Resource "*". List and Describe actions do not support resource-level
#                       scoping, and the S3 bucket configuration reads cover every bucket the
#                       crawler lists.
#   log_bucket          The log buckets the operator names (Terraform cloudtrail_log_bucket and
#                       s3_access_log_bucket, CloudFormation CloudTrailLogBucket and
#                       S3AccessLogBucket), as bucket ARNs. Bucket-level actions only.
#   log_bucket_objects  The objects of those log buckets only (bucket ARN plus "/*"). Never a data
#                       bucket and never "*". No statement is created when no log bucket is named.
cloud: aws
permissions:
  - permission: s3:ListAllMyBuckets
    scopes: [account]
    purpose: List the buckets of the account (S3 ListBuckets) for discovery and read coverage.
    calls:
      - source: da-discovery/src/main/java/com/dlap/discovery/crawler/service/aws/S3ResourceCrawler.java
        line: 117
        call: s3.listBuckets()
      - source: da-discovery/src/main/java/com/dlap/discovery/providers/aws/coverage/S3BucketInventory.java
        line: 118
        call: s3.listBuckets()
  - permission: s3:GetBucketLocation
