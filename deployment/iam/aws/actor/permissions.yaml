no_permission_sources:
  - source: da-autodelete/src/main/java/com/dlap/autodelete/providers/aws/S3ClientFactory.java
    reason: Client factory interface; makes no AWS call.
  - source: da-autodelete/src/main/java/com/dlap/autodelete/providers/aws/ActorCredentials.java
    reason: Builds the credentials provider that assumes the Actor role (EXEC-01); sts:AssumeRole belongs to DLAP's own runtime identity, not to the Actor, and the provider makes no call until a request is signed.
  - source: da-autoarchival/src/main/java/com/dlap/autoarchival/providers/aws/ActorCredentials.java
    reason: Builds the credentials provider that assumes the Actor role (EXEC-01); sts:AssumeRole belongs to DLAP's own runtime identity, not to the Actor, and the provider makes no call until a request is signed.
unreachable_sources:
  - source: da-autoarchival/src/main/java/com/dlap/autoarchival/provider/AwsS3GlacierArchivalProvider.java
    reason: An ICloudArchivalProvider bean that no class injects; the archive executor uses S3LifecycleRuleProvider and AwsS3StorageService.
# The runtime identity (ADR-0113 point 6, Q-703, Q-722). DLAP's own identity (the IRSA role of the
# pod or the instance profile role of the pilot VM) holds no Actor permission. It holds only
# sts:AssumeRole on the named Actor role ARNs, and each Actor role trusts that identity ARN (never
# an account root) with a per-customer sts:ExternalId. The Actor permissions above are what the
# assumed role holds, not what the runtime identity holds. ActorRoleTraceabilityTest checks the
# cited lines, that the resources are role ARNs and never "*", and that Terraform and
# CloudFormation write this trust.
runtime_identity:
  permission: sts:AssumeRole
  holder: DLAP's runtime identity (IRSA role or instance profile role), never an Actor role
  resources: "arn:aws:iam::<customer-account>:role/<actor-role-name>, one per Actor role the operator names; never *"
  trust:
    principal: the runtime role ARN (trusted_principal_arn, TrustedPrincipalArn), never the account root
    condition: sts:ExternalId equals the per-customer external id (external_id, ExternalId)
    max_session_seconds: 3600
  purpose: Let the executors act as the customer's Actor role with a role ARN and an external id instead of the host's own credentials.
  calls:
    - source: da-autodelete/src/main/java/com/dlap/autodelete/providers/aws/ActorCredentials.java
      line: 175
      call: StsAssumeRoleCredentialsProvider.builder()
    - source: da-autodelete/src/main/java/com/dlap/autodelete/providers/aws/ActorCredentials.java
      line: 191
      call: AssumeRoleRequest.builder().roleArn(roleArn)
    - source: da-autodelete/src/main/java/com/dlap/autodelete/providers/aws/ActorCredentials.java
      line: 193
      call: r.externalId(externalId)
    - source: da-autoarchival/src/main/java/com/dlap/autoarchival/providers/aws/ActorCredentials.java
      line: 175
      call: StsAssumeRoleCredentialsProvider.builder()
    - source: da-autoarchival/src/main/java/com/dlap/autoarchival/providers/aws/ActorCredentials.java
      line: 191
      call: AssumeRoleRequest.builder().roleArn(roleArn)
    - source: da-autoarchival/src/main/java/com/dlap/autoarchival/providers/aws/ActorCredentials.java
      line: 193
      call: r.externalId(externalId)
  # The executors assume the Actor role through ActorCredentials (EXEC-01, ADR-0119) when
  # dlap.<service>.aws.credentials-ref names a role ARN; empty keeps the SDK default chain (IRSA,
  # instance profile). da-logingest's Reader assume-role call (ADR-0110) is not an Actor call.
