version: '3.8'

# DLAP Test Environment Microservices
# Strategy 3: Test microservices with +100 port offset for isolation
# Ports: 3100, 8181-8189 to avoid conflicts with dev environment (3000, 8081-8089)

services:

  # Frontend UI Service (Test Environment)
  new-ui:
    build:
      context: ../../../new-ui
      dockerfile: src/main/docker/Dockerfile
    container_name: dlap-new-ui-test
    ports:
      - "3100:3000"    # Test port offset +100
    environment:
      - SPRING_PROFILES_ACTIVE=test
      - KEYCLOAK_AUTH_SERVER_URL=http://keycloak:8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgresql:5432/dlap_common
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092


    depends_on:
      - postgresql
      - keycloak
      - kafka

    networks:
      - dlap-test-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Discovery Service - Data Asset Discovery (Test)
  da-discovery:
