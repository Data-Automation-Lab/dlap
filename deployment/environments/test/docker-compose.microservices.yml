# Test Environment Microservices with +100 port offset
# Usage: docker compose -f docker-compose.yml -f docker-compose.microservices.yml up -d
# Ports: new-ui(3100), discovery(8181), catalog(8182), policyengine(8183), reporting(8184),
#        autolabel(8185), autoarchival(8186), autodelete(8187), autocompliance(8188), admin(8189) 
