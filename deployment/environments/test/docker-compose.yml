version: '3.8'

# DLAP Test Environment Infrastructure
# Strategy 3: Test environment with +100 port offset for isolation
# Ports: Infrastructure uses 5532, 6479, 9192, 8280 etc. to avoid dev conflicts

services:
  # PostgreSQL Database for Test Environment
  postgresql:
    image: postgres:15.1
    container_name: dlap-postgresql-test
    volumes:
      - postgresql-test-data:/var/lib/postgresql/data
      - ../../platform/postgres/init-scripts:/docker-entrypoint-initdb.d
    environment:
      - POSTGRES_USER=dlap
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-dlap}
      - POSTGRES_DB=dlap
      - POSTGRES_MULTIPLE_DATABASES=dlap_common,da_discovery,da_catalog,da_policyengine,da_reporting,da_autolabel,da_autoarchival,da_autodelete,da_autocompliance,da_admin
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_MAX_CONNECTIONS=200
      - POSTGRES_SHARED_BUFFERS=256MB
      - POSTGRES_EFFECTIVE_CACHE_SIZE=768MB
    ports:
      - "5532:5432"    # Test port offset +100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlap -d dlap"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - dlap-test-network

  # Keycloak Identity and Access Management (Test Environment). The same 26.8.1 release, by digest, as the
  # dev compose, the demo and the pilot (Q-509; test-realm-templates.py keeps them equal).
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    container_name: dlap-keycloak-test
    command: 'start-dev --import-realm'
    volumes:
      - keycloak-test-data:/opt/keycloak/data
      - ../../platform/keycloak/keycloak-import:/opt/keycloak/data/import
      - ../../platform/keycloak/keycloak-health-check.sh:/opt/keycloak/health-check.sh
    environment:
      KC_DB: dev-file
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-change-me-dev-only}
      KC_FEATURES_DISABLED: scripts
      KC_HTTP_PORT: 8080
      KC_HTTPS_PORT: 8443
      KC_HEALTH_ENABLED: true
      KC_HOSTNAME_STRICT: false
      KC_LOG_LEVEL: INFO
    ports:
      - "8280:8080"    # Test port offset +100 (8180 + 100)
      - "8543:8443"    # Test port offset +100 (8443 + 100)
    networks:
      - dlap-test-network
    healthcheck:
      # Keycloak 26 serves health on the management port 9000 and the image has no curl.
      test: 'bash /opt/keycloak/health-check.sh'
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 30s
    depends_on:
      - postgresql
    restart: unless-stopped

  # Single Kafka container with KRaft mode (no Zookeeper needed) - Test Environment
  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: dlap-kafka-test
    environment:
      # KRaft mode configuration - Test Environment
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9192'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9192'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      
      # Cluster settings for KRaft
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # Topic and replication settings (single node)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      
      # Performance and retention settings
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: 'false'
      
      # Memory settings for test environment
      KAFKA_HEAP_OPTS: "-Xmx512M -Xms512M"
      
      # Log directories for KRaft
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-test-kraft:/var/lib/kafka/data
    networks:
      - dlap-test-network
    ports:
      - "9192:9192"  # Test environment uses different external port
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Redis removed from test environment to reduce resource usage
  # For production environment, Redis is available in prod/docker-compose.yml

  # Nginx Load Balancer (Test Environment)
  nginx:
    image: nginx:1.25-alpine
    container_name: dlap-nginx-test
    ports:
      - "8180:80"      # Test port offset +100 (8080 + 100)
      - "4543:443"     # Test port offset +100 (4443 + 100)
    volumes:
      - ../../platform/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../platform/nginx/ssl-certs:/etc/nginx/ssl:ro
    depends_on:
      - keycloak
    restart: unless-stopped
    networks:
      - dlap-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgresql-test-data:
    driver: local
  keycloak-test-data:
    driver: local
  kafka-test-kraft:
    driver: local

networks:
  dlap-test-network:
    driver: bridge
    name: dlap-test-network

# Test Environment Infrastructure
# Usage: docker compose -f docker-compose.yml -f docker-compose.microservices.yml up -d
# All ports offset by +100 to avoid conflicts with dev environment 