# DLAP read-only pilot, principal identity map (Q-487, enforcement-contract.md section 6.1).
#
# da-reporting joins a governed read in the audit log to the policy decision for the same asset and
# subject. The log names a cloud principal and the decision names a DLAP subject; the identity map is the
# table that connects them. This overlay mounts a CSV file read-only into da-reporting and points
# DLAP_REPORTING_IDENTITY_MAP_SEED_FILE at it, so the map is applied at every start. The file owns every
# key it names, and rows it no longer names are removed. A missing or invalid file stops the start.
#
# PILOT_IDENTITY_MAP_FILE   host path of the operator's file (default: identity-map/identity-map.csv next
#                           to this file, which has a header and no entries). Use an absolute path; a
#                           relative one is relative to deployment/environments/dev, the folder of the
#                           first compose file. up.sh checks that the file exists and starts with the
#                           header, because Docker would create a directory for a missing path.
#
# Format and a worked example: deployment/examples/identity-map/identity-map.example.csv.
#
# A single file is mounted, so editing it on the host changes nothing in a running container on every
# platform: restart da-reporting after an edit (up.sh restart da-reporting).

services:

  da-reporting:
    environment:
      - DLAP_REPORTING_IDENTITY_MAP_SEED_FILE=/etc/dlap/identity-map.csv
    volumes:
      - ${PILOT_IDENTITY_MAP_FILE:-../pilot/identity-map/identity-map.csv}:/etc/dlap/identity-map.csv:ro
