# DLAP pilot entry point under the TLS overlay (SEC-06).
#
# The routes of ../gateway/nginx.pilot.conf, with three changes:
#   1. The browser reaches this server over TLS only, on 8443 (published by the overlay). There is no
#      plain-HTTP listener at all.
#   2. Every upstream is reached over TLS and its certificate is verified against the pilot CA, for
#      the name in proxy_pass (proxy_ssl_verify, proxy_ssl_name defaults to that host). The names are
#      resolved per request.
#   3. Keycloak is served on the same origin under /realms/ and /resources/, so the browser needs no
#      second host name and the issuer of browser tokens is https://<the origin>/realms/dlap. The
#      admin console and the master realm are not reachable here (use the loopback port).
#
# The SPA bundle carries the quickstart's build-time defaults for the API and Keycloak origins
# (http://localhost:8081 and http://localhost:8180, new-ui frontend src/utils/api.ts and
# src/keycloak.ts). The SPA location rewrites both to the origin of the request, so the browser
# never leaves TLS and never needs a pilot-specific UI build. The smoke test checks the rewrite.
#
# Security headers (Q-190): HSTS, nosniff, Referrer-Policy and Permissions-Policy everywhere; the SPA
# and API also get a Content-Security-Policy and X-Frame-Options. Keycloak's pages keep the headers
# Keycloak sets itself (its own CSP and frame options), plus HSTS.

worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;
    server_tokens off;

    client_max_body_size 25m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Every upstream speaks TLS with a certificate of the pilot CA for its compose name.
    proxy_ssl_trusted_certificate /tls/ca.crt;
    proxy_ssl_verify              on;
    proxy_ssl_verify_depth        2;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse       on;

    # Docker's embedded DNS. Every proxy_pass below names its upstream through a variable, so nginx
    # resolves it per request: a restarted container has a new address, and a stale address would
    # fail the certificate check (proxy_ssl_verify) instead of reaching the service.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /tls/gateway.crt;
        ssl_certificate_key /tls/gateway.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" ciphers for TLS 1.2; TLS 1.3 suites are not configurable here.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache   shared:pilot_tls:10m;
        ssl_session_tickets off;

        # A plain-HTTP request on this port gets nginx's 400 and no content.
        error_page 497 =400 /plain-http-refused;
        location = /plain-http-refused { internal; default_type text/plain; return 400 "TLS required\n"; }

        # Headers of the SPA and the API. A location with add_header of its own does not inherit these,
        # so the Keycloak locations below repeat HSTS and leave the rest to Keycloak.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

        # --- Keycloak on the same origin ---------------------------------------------------------
        # Host carries the port the browser used, so Keycloak builds the issuer and its links for the
        # origin of the request. Keycloak sees TLS from this proxy, so the scheme is https without
        # trusting any forwarded header.
        location /realms/ {
            set $keycloak_upstream https://keycloak:8443;
            proxy_pass $keycloak_upstream;
            proxy_set_header Host $http_host;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
        location /resources/ {
            set $keycloak_upstream https://keycloak:8443;
            proxy_pass $keycloak_upstream;
            proxy_set_header Host $http_host;
            add_header Strict-Transport-Security "max-age=31536000" always;
        }
        # The master realm (the administrator's) and the admin console stay on the loopback port.
        location /realms/master/ { return 404; }

        # --- API: /api/v1/<service> -> backend over TLS (path preserved) ---------------------------
        location /api/v1/catalog/      { set $da_catalog_upstream https://da-catalog:8080; proxy_pass $da_catalog_upstream; }
        location /api/v1/policyengine/ { set $da_policyengine_upstream https://da-policyengine:8080; proxy_pass $da_policyengine_upstream; }
        location /api/v1/reporting/    { set $da_reporting_upstream https://da-reporting:8080; proxy_pass $da_reporting_upstream; }
        location /api/v1/discovery/    { set $da_discovery_upstream https://da-discovery:8080; proxy_pass $da_discovery_upstream; }
        location /api/v1/labeling/     { set $da_autolabel_upstream https://da-autolabel:8080; proxy_pass $da_autolabel_upstream; }
        location /api/v1/label-agent/  { set $da_autolabel_upstream https://da-autolabel:8080; proxy_pass $da_autolabel_upstream; }
        location /api/v1/autolabel/    { set $da_autolabel_upstream https://da-autolabel:8080; proxy_pass $da_autolabel_upstream; }
        location /api/v1/archival/     { set $archival_upstream https://da-autoarchival:8080; proxy_pass $archival_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/deletion/     { set $delete_upstream https://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/delete-agent/ { set $delete_upstream https://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/autodelete/   { set $delete_upstream https://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/compliance/   { set $da_autocompliance_upstream https://da-autocompliance:8080; proxy_pass $da_autocompliance_upstream; }
        location /api/v1/admin/        { set $da_admin_service_upstream https://da-admin-service:8080; proxy_pass $da_admin_service_upstream; }
        location /api/v1/events/       { set $da_policyengine_upstream https://da-policyengine:8080; proxy_pass $da_policyengine_upstream; }

        location @actions_disabled {
            default_type application/json;
            return 404 '{"error":"not found","detail":"the archive and delete services are not running in this deployment"}';
        }

        location /api/ { return 404; }

        # keycloak-js loads this page of the SPA in a hidden iframe of the app itself; its one inline
        # script posts the result to the parent. Allow exactly that on this path.
        location = /silent-check-sso.html {
            set $ui_upstream https://new-ui:3000;
            proxy_pass $ui_upstream;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; frame-ancestors 'self'" always;
        }

        # --- SPA: everything else -> the new-ui static server over TLS ----------------------------
        location / {
            set $ui_upstream https://new-ui:3000;
            proxy_pass $ui_upstream;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
            # Uncompressed answers, so the origin rewrite below sees the text of the bundle.
            proxy_set_header Accept-Encoding "";
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter 'http://localhost:8081' 'https://$http_host';
            sub_filter 'http://localhost:8180' 'https://$http_host';
        }
        location @spa_fallback {
            rewrite ^ /index.html break;
            set $ui_upstream https://new-ui:3000;
            proxy_pass $ui_upstream;
        }
    }
}
