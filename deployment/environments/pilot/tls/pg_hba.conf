#
# Client authentication of the pilot PostgreSQL under the TLS overlay (SEC-06). Read through
# -c hba_file=..., in place of the pg_hba.conf the image writes into the data directory.
#
# The Unix socket inside the container keeps the image's trust rule: the init scripts, the healthcheck
# and the dlap_common upgrade runner of up.sh (docker exec psql) use it, and only a process inside the
# container reaches it. Every TCP connection, loopback included (the backup agent shares this
# container's network), must use TLS and a SCRAM password. A connection without TLS is refused by name.

# TYPE      DATABASE     USER  ADDRESS  METHOD
local       all          all            trust
hostnossl   all          all   all      reject
hostnossl   replication  all   all      reject
hostssl     replication  all   all      scram-sha-256
hostssl     all          all   all      scram-sha-256
