# DLAP pilot API gateway (DEP-01).
#
# The quickstart gateway (../dev/gateway/nginx.conf) with one change: da-autoarchival and
# da-autodelete are optional in the pilot (compose profile "actions"), and nginx exits at start-up
# when a literal upstream name does not resolve. Those two upstreams are therefore resolved on
# demand through Docker's embedded DNS, and a request to them while the service is not running gets a
# clean 404 instead of a gateway crash. Every other route is unchanged.
#
# Same limits as the quickstart: no authN, no rate limiting and no TLS here. JWTs are validated by
# each service. TLS arrives with the SEC-06 overlay.

worker_processes 1;
events { worker_connections 1024; }

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Allow large policy/report payloads.
    client_max_body_size 25m;

    # Shared proxy settings applied in every location below.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    # WebSocket upgrade (Event Center stream).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_read_timeout 120s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS, for the on-demand upstreams below.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 8081;
        server_name _;

        # --- API: /api/v1/<service> -> backend (path preserved) ---------------
        location /api/v1/catalog/       { proxy_pass http://da-catalog:8080; }
        location /api/v1/policyengine/  { proxy_pass http://da-policyengine:8080; }
        location /api/v1/reporting/     { proxy_pass http://da-reporting:8080; }
        location /api/v1/discovery/     { proxy_pass http://da-discovery:8080; }
        location /api/v1/labeling/      { proxy_pass http://da-autolabel:8080; }
        location /api/v1/label-agent/   { proxy_pass http://da-autolabel:8080; }
        location /api/v1/autolabel/     { proxy_pass http://da-autolabel:8080; }
        # Optional services (compose profile "actions"). A variable in proxy_pass makes nginx resolve the
        # name per request; with no URI part the request path is passed through unchanged, as above.
        location /api/v1/archival/      { set $archival_upstream http://da-autoarchival:8080; proxy_pass $archival_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/deletion/      { set $delete_upstream http://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/delete-agent/  { set $delete_upstream http://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/autodelete/    { set $delete_upstream http://da-autodelete:8080; proxy_pass $delete_upstream; error_page 502 503 = @actions_disabled; }
        location /api/v1/compliance/    { proxy_pass http://da-autocompliance:8080; }
        location /api/v1/admin/         { proxy_pass http://da-admin-service:8080; }
        # Event Center lives in da-policyengine.
        location /api/v1/events/        { proxy_pass http://da-policyengine:8080; }

        # The archive and delete services are off by default; say so instead of returning a bare 502. Only
        # the three optional routes above use this, so a real 502 from any other service is not masked.
        location @actions_disabled {
            default_type application/json;
            return 404 '{"error":"not found","detail":"the archive and delete services are not running in this deployment"}';
        }

        # Any other /api/* path is a real miss, return a clean 404 rather than
        # letting it fall through to the SPA fallback below (which would return
        # index.html with 200 and mask a mis-routed API call as "success").
        location /api/ { return 404; }

        # --- SPA: everything else -> the new-ui static server -----------------
        # History-API fallback: the React app is client-side routed, so deep-links
        # and browser refreshes on routes like /login have no server-side file and
        # the static server returns 404. Serve the SPA shell (index.html) for those
        # 404s so React Router can resolve the route in the browser. API locations
        # above match first, so genuine API 404s are unaffected.
        location / {
            proxy_pass http://new-ui:3000;
            proxy_intercept_errors on;
            error_page 404 = @spa_fallback;
        }
        location @spa_fallback {
            # Named locations forbid a URI in proxy_pass; rewrite to the SPA shell first.
            rewrite ^ /index.html break;
            proxy_pass http://new-ui:3000;
        }
    }
}
