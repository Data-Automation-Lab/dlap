      - pilot-tls:/tls:ro
    group_add:
      - "61108"
    environment:
      <<: *tls-spring-env
      SERVER_SSL_CERTIFICATE: "file:/tls/da-autocompliance.crt"
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autocompliance.key"
      MANAGEMENT_SERVER_SSL_CERTIFICATE: "file:/tls/da-autocompliance.crt"
      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autocompliance.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_autocompliance?sslmode=verify-full&sslrootcert=/tls/ca.crt"
      SPRING_APPLICATION_JSON: >-
        {"dlap.services.catalog.url":"https://da-catalog:8080",
        "dlap.service-auth.enabled":"true",
        "dlap.service-auth.token-uri":"https://keycloak:8443/realms/dlap/protocol/openid-connect/token",
        "dlap.service-auth.client-id":"dlap-backend"}

  da-admin-service:
    depends_on: *kafka-ready
    env_file:
      - path: ${PILOT_TLS_DIR:-../pilot/tls/generated}/env/da-admin-service.env
        required: false
