      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-logingest.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_logingest?sslmode=verify-full&sslrootcert=/tls/ca.crt"

  # --- Actions (profile "actions") ----------------------------------------------------------------

  da-autoarchival:
    depends_on: *kafka-ready
    env_file:
      - path: ${PILOT_TLS_DIR:-../pilot/tls/generated}/env/da-autoarchival.env
        required: false
    volumes:
      - pilot-tls:/tls:ro
    group_add:
      - "61106"
    environment:
      <<: *tls-spring-env
      SERVER_SSL_CERTIFICATE: "file:/tls/da-autoarchival.crt"
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autoarchival.key"
      MANAGEMENT_SERVER_SSL_CERTIFICATE: "file:/tls/da-autoarchival.crt"
      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autoarchival.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_autoarchival?sslmode=verify-full&sslrootcert=/tls/ca.crt"
      # The approval API: the executor re-reads every approval here just before it acts (Q-602, Q-604). The
      # request is verified against the pilot CA through JDK_JAVA_OPTIONS above, the same trust store as every
      # other service-to-service call.
      SPRING_APPLICATION_JSON: >-
        {"dlap.catalog-service.url":"https://da-catalog:8080",
        "dlap.services.da-policyengine.url":"https://da-policyengine:8080",
        "dlap.service-auth.enabled":"true",
        "dlap.service-auth.token-uri":"https://keycloak:8443/realms/dlap/protocol/openid-connect/token",
        "dlap.service-auth.client-id":"dlap-backend"}

  da-autodelete:
    depends_on: *kafka-ready
    env_file:
      - path: ${PILOT_TLS_DIR:-../pilot/tls/generated}/env/da-autodelete.env
        required: false
    volumes:
      - pilot-tls:/tls:ro
    group_add:
      - "61107"
    environment:
      <<: *tls-spring-env
      SERVER_SSL_CERTIFICATE: "file:/tls/da-autodelete.crt"
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autodelete.key"
      MANAGEMENT_SERVER_SSL_CERTIFICATE: "file:/tls/da-autodelete.crt"
      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autodelete.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_autodelete?sslmode=verify-full&sslrootcert=/tls/ca.crt"
      # The approval API (Q-613): the default http://da-policyengine:8080 fits the dev and e2e compose only.
      SPRING_APPLICATION_JSON: >-
        {"dlap.catalog-service.url":"https://da-catalog:8080",
        "dlap.policyengine-service.url":"https://da-policyengine:8080",
        "dlap.service-auth.enabled":"true",
        "dlap.service-auth.token-uri":"https://keycloak:8443/realms/dlap/protocol/openid-connect/token",
        "dlap.service-auth.client-id":"dlap-backend"}

  # --- Monitoring profile: the two exporters reach their targets over TLS --------------------------

  # Prometheus scrapes the services over HTTPS with the pilot CA (Q-518). The CA is public; the volume also
  # holds private keys, but every one is 0440 for a group Prometheus is not in, so it reads ca.crt only.
  # The command repeats the base command with the TLS configuration file: compose replaces a command, it
  # does not merge it (test-prometheus-tls.py keeps the other flags equal to the dev compose).
  prometheus:
    depends_on:
      tls-init:
        condition: service_completed_successfully
      alertmanager:
        condition: service_started
    command: !override
      - "--config.file=/etc/prometheus/prometheus.tls.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - pilot-tls:/tls:ro

  postgres-exporter:
    depends_on:
      tls-init:
        condition: service_completed_successfully
    environment:
      - DATA_SOURCE_URI=postgresql:5432/dlap?sslmode=verify-full&sslrootcert=/tls/ca.crt
    volumes:
      - pilot-tls:/tls:ro
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *tls-logging

  kafka-exporter:
    depends_on: *kafka-ready
    # The image has a shell; the password is read from the file that only this container's group sees.
    entrypoint: ["/bin/sh", "-c"]
    command: !override
      - >-
        exec /bin/kafka_exporter --kafka.server=kafka:29092
        --tls.enabled --tls.ca-file=/tls/ca.crt --tls.server-name=kafka
        --sasl.enabled --sasl.mechanism=scram-sha512 --sasl.username=dlap-kafka-exporter
        --sasl.password="$$(cat /tls/kafka-exporter.password)"
    volumes:
      - pilot-tls:/tls:ro
    group_add:
      - "61012"
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *tls-logging

  # Not a TLS change: the base overlay gives Alertmanager no memory limit, so verify.sh failed with
  # every profile on (as it did for the two exporters, which get theirs above).
  alertmanager:
    deploy:
      resources:
        limits:
          memory: 64m
    logging: *tls-logging

volumes:
  pilot-tls:
