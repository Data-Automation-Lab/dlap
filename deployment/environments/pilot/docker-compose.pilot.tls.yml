      SERVER_SSL_CERTIFICATE: "file:/tls/da-autolabel.crt"
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autolabel.key"
      MANAGEMENT_SERVER_SSL_CERTIFICATE: "file:/tls/da-autolabel.crt"
      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-autolabel.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_autolabel?sslmode=verify-full&sslrootcert=/tls/ca.crt"
      # The base overlay's keys (rules provider, no mock), with https:// URLs. The client secret stays in
      # DLAP_SERVICE_AUTH_CLIENT_SECRET (SEC-05), not in this JSON.
      SPRING_APPLICATION_JSON: >-
        {"da-catalog.service.url":"https://da-catalog:8080",
        "dlap.service-auth.enabled":"true",
        "dlap.service-auth.token-uri":"https://keycloak:8443/realms/dlap/protocol/openid-connect/token",
        "dlap.service-auth.client-id":"dlap-backend",
        "dlap.autolabel.llm-provider":"rules",
        "dlap.autolabel.allow-mock":"false"}

