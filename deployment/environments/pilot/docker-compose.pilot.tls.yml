      SERVER_SSL_CERTIFICATE: "file:/tls/da-admin-service.crt"
      SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-admin-service.key"
      MANAGEMENT_SERVER_SSL_CERTIFICATE: "file:/tls/da-admin-service.crt"
      MANAGEMENT_SERVER_SSL_CERTIFICATE_PRIVATE_KEY: "file:/tls/da-admin-service.key"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql:5432/da_admin?sslmode=verify-full&sslrootcert=/tls/ca.crt"
      SPRING_APPLICATION_JSON: >-
        {"services.da-discovery.url":"https://da-discovery:8080",
        "services.da-autolabel.url":"https://da-autolabel:8080",
        "services.da-autodelete.url":"https://da-autodelete:8080",
        "services.da-autoarchival.url":"https://da-autoarchival:8080",
        "services.da-autocompliance.url":"https://da-autocompliance:8080",
        "dlap.service-auth.enabled":"true",
        "dlap.service-auth.token-uri":"https://keycloak:8443/realms/dlap/protocol/openid-connect/token",
        "dlap.service-auth.client-id":"dlap-backend"}

  da-logingest:
