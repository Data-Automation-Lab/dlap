# DLAP hosted-demo gateway (DEMO-01).
#
# The one nginx behind Caddy (caddy/Caddyfile). Compared with the quickstart gateway
# (../dev/gateway/nginx.conf) it:
#   - serves the built SPA from /usr/share/nginx/html itself (no new-ui JVM) and falls back to
#     index.html for client-side routes;
#   - refuses the MVEL era test-rule endpoint and the documentation and actuator surface of every
#     service, wherever they hang in the path (defense in depth: the services no longer ship test-rule);
#   - routes /access/v1/ (the AuthZEN PDP) to da-policyengine, with its own tight rate limit. The PDP
#     still demands ROLE_SERVICE_ACCOUNT or ROLE_ADMIN, so a route is not access;
#   - limits request rate, connections, body size and timeouts;
#   - resolves every upstream per request through Docker's DNS. nginx therefore starts with no
#     backend running, and keeps working while the nightly reset stops and restarts the services
#     (a literal upstream name is resolved once at start and goes stale when the container gets a new IP);
#   - logs the path without the query string, so an OIDC code or state parameter never reaches the log.
#
# Not here: TLS, which Caddy terminates, and authentication, which each service enforces on its JWT.
# Optional services (admin and compliance run only in the "plus" compose profile) answer a clean 503.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    log_format demo '$remote_addr $request_method $uri $status $body_bytes_sent ${request_time}s '
                    'ua="$http_user_agent"';
    access_log /dev/stdout demo;

    # The container root file system is read only; everything nginx writes goes to /tmp.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The client address comes from Caddy (X-Forwarded-For), which overwrites whatever the client sent.
    # Only the private ranges Docker hands out are trusted, and the gateway is never published.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # --- Limits -------------------------------------------------------------------------------
    client_max_body_size 256k;
    client_body_buffer_size 256k;
    large_client_header_buffers 4 16k;
    client_header_timeout 10s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    reset_timedout_connection on;

    limit_req_zone  $binary_remote_addr zone=demo_api:10m    rate=15r/s;
    limit_req_zone  $binary_remote_addr zone=demo_static:10m rate=30r/s;
    limit_req_zone  $binary_remote_addr zone=demo_authzen:1m rate=2r/s;
    limit_conn_zone $binary_remote_addr zone=demo_conn:10m;
    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level warn;
    limit_conn_log_level warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # --- Proxy defaults ---------------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    # WebSocket upgrade (Event Center stream).
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. A short validity so a restarted container is found again quickly.
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 8081;
        server_name _;

        # Upstreams. A variable in proxy_pass makes nginx resolve the name per request.
        set $up_catalog      http://da-catalog:8080;
        set $up_policyengine http://da-policyengine:8080;
        set $up_reporting    http://da-reporting:8080;
        set $up_discovery    http://da-discovery:8080;
        set $up_autolabel    http://da-autolabel:8080;
        set $up_archival     http://da-autoarchival:8080;
        set $up_delete       http://da-autodelete:8080;
        set $up_compliance   http://da-autocompliance:8080;
        set $up_admin        http://da-admin-service:8080;

        limit_conn demo_conn 40;

        # Baseline browser headers. Caddy adds HSTS and the exact Content-Security-Policy (it knows the
        # Keycloak host). A location that sets its own add_header drops these, so none below does:
        # caching uses expires.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;

        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$) { return 405; }

        error_page 502 503 504 = @upstream_down;
        location @upstream_down {
            default_type application/json;
            add_header Retry-After "30" always;
            add_header X-Content-Type-Options "nosniff" always;
            return 503 '{"error":"unavailable","detail":"this part of the demo is not running or is restarting"}';
        }

        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # --- Refused everywhere (regular expressions win over the prefix locations below) -----
        # The MVEL era rule tester. The services no longer expose it; the gateway still says no.
        location ~* (^|/)test-rule(/|$) {
            default_type application/json;
            return 403 '{"error":"forbidden","detail":"this endpoint is disabled on the public demo"}';
        }
        # Actuator, Swagger UI and OpenAPI documents of every service.
        location ~* (^|/)(actuator|swagger-ui|swagger-ui\.html|v3/api-docs|api-docs)(/|$|\.) {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }
        # Dot files other than .well-known.
        location ~ /\.(?!well-known) {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }

        # --- AuthZEN PDP ----------------------------------------------------------------------
        location /access/v1/ {
            limit_req zone=demo_authzen burst=5 nodelay;
            proxy_pass $up_policyengine;
        }

        # --- API: /api/v1/<service> -> backend (path preserved) --------------------------------
        location /api/v1/catalog/       { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_catalog; }
        location /api/v1/policyengine/  { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_policyengine; }
        location /api/v1/reporting/     { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_reporting; }
        location /api/v1/discovery/     { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_discovery; }
        location /api/v1/labeling/      { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_autolabel; }
        location /api/v1/label-agent/   { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_autolabel; }
        location /api/v1/autolabel/     { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_autolabel; }
        location /api/v1/archival/      { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_archival; }
        location /api/v1/deletion/      { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_delete; }
        location /api/v1/delete-agent/  { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_delete; }
        location /api/v1/autodelete/    { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_delete; }
        # Run only in the "plus" profile; absent in Lite, where they answer 503 through @upstream_down.
        location /api/v1/compliance/    { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_compliance; }
        location /api/v1/admin/         { limit_req zone=demo_api burst=60 nodelay; proxy_pass $up_admin; }
        # Event Center lives in da-policyengine; its stream is long lived, so no response buffering.
        location /api/v1/events/ {
            limit_req zone=demo_api burst=60 nodelay;
            proxy_buffering off;
            proxy_pass $up_policyengine;
        }

        # Any other /api path is a real miss. A clean 404 beats the SPA fallback below, which would
        # answer index.html with 200 and hide a mis-routed call.
        location /api/ {
            default_type application/json;
            return 404 '{"error":"not found"}';
        }

        # --- SPA: static files from the build, history-API fallback -----------------------------
        root /usr/share/nginx/html;
        index index.html;

        location ^~ /assets/ {
            limit_req zone=demo_static burst=100 nodelay;
            expires 1y;
            try_files $uri =404;
        }
        location = /index.html {
            expires -1;
        }
        location / {
            limit_req zone=demo_static burst=100 nodelay;
            try_files $uri $uri/ /index.html;
        }
    }
}
