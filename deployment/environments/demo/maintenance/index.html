<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="30">
  <meta name="robots" content="noindex">
  <title>Demo resetting</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fa;
      --fg: #1c2330;
      --muted: #566178;
      --card: #ffffff;
      --line: #d9dee8;
      --accent: #1d5fd0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11151c;
        --fg: #e6e9f0;
        --muted: #a2abbd;
        --card: #1a202b;
        --line: #2c3544;
        --accent: #7aa7f5;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main {
      width: 100%;
      max-width: 34rem;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 28px 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.4rem; line-height: 1.25; }
    p { margin: 0 0 12px; }
    .muted { color: var(--muted); font-size: 0.9rem; margin: 20px 0 0; }
    .bar {
      height: 4px;
      margin: 18px 0 4px;
      border-radius: 2px;
      background: var(--line);
      overflow: hidden;
    }
    .bar span {
      display: block;
      width: 35%;
      height: 100%;
      background: var(--accent);
      animation: slide 2.2s ease-in-out infinite;
    }
    @keyframes slide { from { margin-left: -35%; } to { margin-left: 100%; } }
    @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; opacity: 0.4; } }
  </style>
</head>
<body>
  <main role="main">
    <h1>The demo is resetting</h1>
    <p>Every night the demo returns to its starting data, and it is restarting now. This takes a few minutes. This page refreshes on its own.</p>
    <div class="bar" role="presentation"><span></span></div>
    <p class="muted">Demo on synthetic data. No cloud account connected. Not production.</p>
  </main>
</body>
</html>
