# DLAP Da-autoarchival Service Configuration
# Standardized configuration for Docker and local development

spring.application.name=da-autoarchival
# Spring Boot 4 (BOOT-01, ADR-0066): Spring MVC and the imperative HTTP clients keep the Jackson 2
# ObjectMapper of spring-boot-jackson2, so JSON request and response bodies do not change.
spring.http.converters.preferred-json-mapper=jackson2
# springdoc 3 writes OpenAPI 3.1 by default; the published contract stays OpenAPI 3.0 (BOOT-01).
springdoc.api-docs.version=openapi_3_0
# Log correlation: include trace/span ids so logs join once a tracer is wired
# (inert without a tracer bridge; MDC keys default to empty). See docs/observability.md.
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]

# Server Configuration
server.port=8086



# Database Configuration - using infrastructure PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/da_autoarchival
spring.datasource.username=${DB_USER:da_autoarchival_user}
spring.datasource.password=${DB_PASS:da_autoarchival_pass}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Configuration
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# JPA Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=dlap_autoarchival
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway (schema migrations)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=dlap_autoarchival
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true

# Kafka Configuration
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=da-autoarchival-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=MANUAL_IMMEDIATE
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# SEC-03: a closed list, never a wildcard. The consumers of this service read values as Object or String and
# ignore type headers (KAFKA-01), so the list is a second lock behind the first.
spring.kafka.consumer.properties.spring.json.trusted.packages=com.dlap.common.logevent
# Q-029: cap a client-supplied page size (Spring Data allows 2000 by default).
spring.data.web.pageable.max-page-size=200
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Security Configuration - using infrastructure Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/certs
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:3001}

# Management/Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.endpoint.health.probes.enabled=true

# Logging Configuration
logging.level.com.dlap=${LOG_LEVEL:INFO}
logging.level.org.springframework.kafka=WARN
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=${SQL_LOG_LEVEL:WARN}
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level [%logger{36}] - %msg%n

# DLAP Specific Configuration
dlap.service.name=Da-autoarchival Service
dlap.service.version=1.0.0
dlap.service.description=Da-autoarchival microservice for DLAP platform

# da-catalog M2M lookup. An archival task resolves each asset's real assetUri +
# cloudProvider here before any cloud call; an unresolvable asset fails closed rather
# than being archived at an invented location. Bearer tokens come from da-protos'
# ServiceAuthAutoConfiguration; the catalog endpoint allows ROLE_SERVICE_ACCOUNT (ADR-0034).
dlap.catalog-service.url=${DA_CATALOG_URL:http://localhost:8082}
dlap.service-auth.enabled=${DLAP_SERVICE_AUTH_ENABLED:false}
dlap.service-auth.token-uri=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/dlap/protocol/openid-connect/token
dlap.service-auth.client-id=${DLAP_SERVICE_CLIENT_ID:dlap-backend}
dlap.service-auth.client-secret=${DLAP_SERVICE_CLIENT_SECRET:change-me-dev-only}

# Common entities database connection (for da-protos entities)
dlap.common-db.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/dlap_common
dlap.common-db.username=${DB_USER:dlap_common_user}
dlap.common-db.password=${DB_PASS:dlap_common_pass}

# Profile specific overrides
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Kafka Topics
dlap.kafka.topics.policy-actions=dlap.policies.actions
dlap.kafka.topics.archival-events=dlap.archival.events

# Cloud Storage Configuration
# AWS S3/Glacier Configuration
aws.s3.region=us-east-1
aws.s3.bucket.archival=dlap-archival-bucket
aws.glacier.vault.name=dlap-glacier-vault

# Azure Blob Storage Configuration
azure.storage.account.name=dlaparchival
azure.storage.container.archival=archival-container

# Google Cloud Storage Configuration
gcp.storage.project.id=dlap-project
gcp.storage.bucket.archival=dlap-gcp-archival
# Honest by default: prod runs the real GCS storage-class transition (needs Application
# Default Credentials). Set to true ONLY in dev/CI to mock-succeed without touching GCS.
dlap.autoarchival.gcs.mock-mode=${DLAP_AUTOARCHIVAL_GCS_MOCK_MODE:false}

# Azure Blob Storage archival. Honest by default: prod runs the real access-tier
# transition. Set mock-mode true only in dev/CI to succeed without touching Azure.
# EXEC-01 (Q-724): the executor signs in with DefaultAzureCredential (managed identity, workload identity,
# environment), so the archive Actor role and the permission self-check cover it. account-endpoint is the
# account's blob endpoint, for example https://myaccount.blob.core.windows.net; empty derives
# https://<account>.blob.core.windows.net from each asset's location.
dlap.autoarchival.azure.mock-mode=${DLAP_AUTOARCHIVAL_AZURE_MOCK_MODE:false}
dlap.autoarchival.azure.account-endpoint=${DLAP_AUTOARCHIVAL_AZURE_ACCOUNT_ENDPOINT:}
# DEPRECATED fallback, removed in the next release: a connection string is not governed by Azure RBAC and may hold
# an account key. It logs a WARN at start-up and the prod profile refuses it (EmulatorEndpointGuard).
dlap.autoarchival.azure.connection-string=${DLAP_AUTOARCHIVAL_AZURE_CONNECTION_STRING:}

# AWS Actor role (EXEC-01, Q-722, ADR-0110). Empty: the SDK default chain (instance profile, environment keys,
# shared profile, or an EKS web identity token through IRSA) is the Actor. A role ARN, or the name of an
# environment variable that holds one (optionally env:NAME), makes the service assume that role with STS, session
# name dlap-autoarchival; external-id is the sts:ExternalId of the role's trust policy; sts-endpoint and sts-region
# are optional. Configuration only: nothing is called until a request is signed.
dlap.autoarchival.aws.credentials-ref=${DLAP_AUTOARCHIVAL_AWS_CREDENTIALS_REF:}
dlap.autoarchival.aws.external-id=${DLAP_AUTOARCHIVAL_AWS_EXTERNAL_ID:}
dlap.autoarchival.aws.sts-endpoint=${DLAP_AUTOARCHIVAL_AWS_STS_ENDPOINT:}
dlap.autoarchival.aws.sts-region=${DLAP_AUTOARCHIVAL_AWS_STS_REGION:}

# Archival Configuration
archival.default.retention.days=2555  # 7 years
archival.cost.optimization.threshold=0.3  # 30% savings threshold
archival.batch.size=100 

# RET-03 (decision D20): archive on the cloud's native lifecycle primitive.
# A bucket or prefix becomes an S3 lifecycle transition, a GCS lifecycle SetStorageClass rule or an Azure
# management policy rule; the provider moves the objects on its own schedule and a provider log event, not
# DLAP's own call, proves it (da-autoarchival/docs/NATIVE_ARCHIVE_RULES.md).
# Approval API of da-policyengine: every archive is checked there just before it runs
# (docs/specs/approvals.md section 9, rule 3), as ROLE_SERVICE_ACCOUNT through dlap.service-auth.*.
dlap.services.da-policyengine.url=${DA_POLICYENGINE_URL:http://localhost:8083}
dlap.autoarchival.approvals.timeout-seconds=10
# Limits of a native rule; the provider's own maxima (S3 1000, GCS 100, Azure 100 rules) always apply too.
dlap.autoarchival.rules.max-prefix-bytes=1024
dlap.autoarchival.rules.max-dlap-rules-per-bucket=20
dlap.autoarchival.rules.max-after-days=3650
dlap.autoarchival.rules.listing-default-keys=50
dlap.autoarchival.rules.listing-max-keys=1000
dlap.autoarchival.rules.allow-bucket-wide=true
dlap.autoarchival.rules.direct-object-enabled=true
# Tier when neither the action nor the archival configuration names one: COOL, COLD or ARCHIVE.
dlap.autoarchival.rules.default-tier=COLD
# Replayed events (fixtures, demo seeding) never prove a transition unless this is true (tests only).
dlap.autoarchival.rules.accept-replay-evidence=false
# TEST-ONLY endpoints (Q-713, EXEC-01 Q-740, Q-745): one scheme in both retire executors,
# dlap.<service>.test-endpoint.{s3, s3-path-style, gcs, azure}. They are empty by default and are not listed here
# on purpose: each reads the deprecated RET-03 name below as its fallback (TestEndpointProperties), so setting
# only the old name keeps working for one release. Set them through the environment, for the lifecycle harness and
# the container tests only:
#   DLAP_AUTOARCHIVAL_TEST_ENDPOINT_S3            an S3-compatible endpoint (LocalStack, moto)
#   DLAP_AUTOARCHIVAL_TEST_ENDPOINT_S3_PATH_STYLE path-style requests, true by default
#   DLAP_AUTOARCHIVAL_TEST_ENDPOINT_GCS           a GCS emulator host (fake-gcs-server)
#   DLAP_AUTOARCHIVAL_TEST_ENDPOINT_AZURE         an https blob endpoint of a stub, with a placeholder token
# The S3 test endpoint signs with the default credentials chain when it resolves, else anonymously. The service
# refuses to start under the prod profile when any of them is set (EmulatorEndpointGuard).
# DEPRECATED RET-03 names, empty by default; each logs a WARN naming its replacement and is removed in the next
# release (the keys have no replacement property: use the default credentials chain):
dlap.autoarchival.aws.endpoint-override=
dlap.autoarchival.aws.endpoint-access-key=
dlap.autoarchival.aws.endpoint-secret-key=
dlap.autoarchival.gcs.endpoint-override=
# The project the GCS emulator host is addressed with (not an endpoint; kept).
dlap.autoarchival.gcs.endpoint-project=dlap-emulator
# Audit log (AUD-01, stream retire.archive): the service's own database role is the stream's writer. Empty
# derives the dlap_common URL from spring.datasource.url.
dlap.audit.datasource.url=

# RET-05 (Q-607): the archive rule reconciliation. It lists rules APPLIED longer than max-applied without
# provider proof and rows stuck EXECUTING, logs them and exposes the counts as metrics. It changes no state.
dlap.autoarchival.reconcile.enabled=${DLAP_AUTOARCHIVAL_RECONCILE_ENABLED:true}
dlap.autoarchival.reconcile.interval=PT1H
dlap.autoarchival.reconcile.initial-delay=PT5M
dlap.autoarchival.reconcile.lock-at-most-for=PT10M
dlap.autoarchival.reconcile.max-applied=P7D
dlap.autoarchival.reconcile.claim-timeout=PT30M
dlap.autoarchival.reconcile.log-limit=50
